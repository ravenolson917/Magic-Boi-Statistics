<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Friday Night Commander — Stats Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>
  :root{
    --bg:#1c1510;
    --card:#2a2018;
    --ink:#f0e6d8;
    --ink-soft:#b3a08c;
    --line:#4a3a2c;
    --accent:#c9a06a;
    --accent-soft:#4a3a26;
    --good:#8faf6e;
    --good-soft:#2e3524;
    --bad:#c46a4e;
    --bad-soft:#3c2620;
    --w:#e8dcc0; --u:#8fa8bc; --b:#8a7d72; --r:#c17f5e; --g:#8fa878;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:'Inter',sans-serif; -webkit-font-smoothing:antialiased;
    position:relative; min-height:100vh;
  }
  body::before{
    content:''; position:fixed; inset:-15%; z-index:0; pointer-events:none;
    background:
      radial-gradient(circle at 18% 22%, rgba(201,160,106,0.16), transparent 42%),
      radial-gradient(circle at 82% 28%, rgba(196,106,78,0.13), transparent 46%),
      radial-gradient(circle at 50% 85%, rgba(143,175,110,0.09), transparent 42%);
    filter:blur(70px);
    animation:auroraDrift 24s ease-in-out infinite alternate;
  }
  @keyframes auroraDrift{
    0%{ transform:translate(0,0) scale(1); }
    50%{ transform:translate(-3%,2%) scale(1.08); }
    100%{ transform:translate(2%,-3%) scale(1.03); }
  }
  #topbar, main, footer{ position:relative; z-index:1; }
  h1,h2,h3{font-family:'Sora',sans-serif; margin:0;}
  .mono{font-family:'IBM Plex Mono',monospace;}

  /* ---------- layout ---------- */
  #topbar{
    position:sticky; top:0; z-index:20;
    background:rgba(28,21,16,0.92); backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);
    padding:14px 22px; display:flex; align-items:center; justify-content:space-between; gap:16px;
    flex-wrap:wrap;
  }
  .brand{display:flex; align-items:center; gap:10px;}
  .brand-mark{
    width:30px; height:30px; border-radius:8px;
    background:conic-gradient(from 180deg, var(--w), var(--u), var(--b), var(--r), var(--g), var(--w));
    flex-shrink:0;
  }
  .mana-pip{
    display:inline-block; width:13px; height:13px; border-radius:50%;
    border:1.5px solid rgba(255,255,255,0.2); margin-right:2px; vertical-align:middle;
  }
  .mana-W{background:var(--w);} .mana-U{background:var(--u);} .mana-B{background:var(--b);}
  .mana-R{background:var(--r);} .mana-G{background:var(--g);}
  .mana-C{background:#5c4d3d;}
  .cmd-thumb{
    width:34px; height:24px; border-radius:4px; object-fit:cover; object-position:center 30%;
    background:#3a2c20; vertical-align:middle; margin-right:8px; flex-shrink:0;
  }
  .cmd-cell{display:flex; align-items:center;}
  .podium-gallery{
    display:grid; grid-template-columns:repeat(3, 1fr); gap:16px; margin-bottom:16px;
  }
  @media (max-width:640px){ .podium-gallery{grid-template-columns:1fr;} }
  .card-gallery{
    display:flex; flex-direction:column; margin-bottom:18px;
  }
  .card-list-row{
    display:flex; align-items:center; gap:16px; padding:12px 0;
    border-bottom:1px solid var(--line);
  }
  .card-list-row:last-child{border-bottom:none;}
  .card-list-img{
    width:150px; aspect-ratio:63/88; border-radius:10px; overflow:hidden; flex-shrink:0; background:#3a2c20;
  }
  .card-list-img img{width:100%; height:100%; object-fit:cover; display:block;}
  .card-list-rank{
    width:26px; flex-shrink:0; text-align:center; font-family:'IBM Plex Mono',monospace;
    font-size:12.5px; color:var(--ink-soft);
  }
  .card-list-info{flex:1; min-width:0;}
  .card-list-name{font-weight:700; font-size:14.5px;}
  .card-list-pilot{font-size:12px; color:var(--ink-soft); margin-top:2px;}
  .card-list-stats{display:flex; gap:16px; margin-top:7px; flex-wrap:wrap; font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--ink-soft);}
  .card-list-stats b{color:var(--accent); font-size:13px;}
  .card-tile{
    position:relative; border-radius:12px; overflow:hidden; aspect-ratio:63/88;
    background:#3a2c20; cursor:default; transition:transform .18s ease, box-shadow .18s ease;
  }
  .card-tile:hover{transform:translateY(-4px);}
  .card-tile img{width:100%; height:100%; object-fit:cover; display:block;}
  .card-tile .overlay{
    position:absolute; left:0; right:0; bottom:0; padding:10px 10px 9px;
    background:linear-gradient(0deg, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.35) 65%, rgba(0,0,0,0) 100%);
    color:#fff;
  }
  .card-tile .cname{font-size:12px; font-weight:700; line-height:1.25; margin-bottom:4px;}
  .card-tile .cstat-stack div{font-size:10.5px; opacity:0.9; font-family:'IBM Plex Mono',monospace; line-height:1.6;}
  .card-tile.podium-tile{border-radius:14px;}
  .card-tile.podium-tile .cname{font-size:15px;}
  .card-tile.podium-tile .cstat-stack div{font-size:12px;}
  .card-tile.rank-1{border:2px solid #e8c780; box-shadow:0 0 0 1px rgba(232,199,128,0.3), 0 16px 34px rgba(0,0,0,0.4);}
  .card-tile.rank-2{border:2px solid #c9c9d0; box-shadow:0 0 0 1px rgba(201,201,208,0.25), 0 14px 28px rgba(0,0,0,0.35);}
  .card-tile.rank-3{border:2px solid #c48a5a; box-shadow:0 0 0 1px rgba(196,138,90,0.25), 0 14px 28px rgba(0,0,0,0.35);}
  .tile-badge{
    position:absolute; top:8px; left:8px; z-index:2;
    font-size:18px; line-height:1; filter:drop-shadow(0 2px 3px rgba(0,0,0,0.6));
  }
  .brand h1{font-size:17px; letter-spacing:-0.01em;}
  .brand span{display:block; font-size:11px; color:var(--ink-soft); font-family:'IBM Plex Mono',monospace;}
  nav{display:flex; gap:4px; flex-wrap:wrap; position:relative;}
  #nav-indicator{
    position:absolute; top:0; height:100%; border-radius:20px; background:var(--accent);
    transition:left .4s cubic-bezier(.22,.9,.28,1.1), width .4s cubic-bezier(.22,.9,.28,1.1);
    z-index:0; pointer-events:none;
  }
  nav button{
    position:relative; z-index:1;
    font-family:'Inter',sans-serif; font-weight:600; font-size:13.5px;
    padding:8px 14px; border-radius:20px; border:1px solid transparent;
    background:transparent; color:var(--ink-soft); cursor:pointer;
    transition:color .2s ease, background .2s ease, transform .12s ease;
  }
  nav button:not(.active):hover{color:var(--ink); background:#342718;}
  nav button.active{color:#2a1c0f; background:transparent;}
  nav button:active{transform:scale(0.93);}
  #refresh-btn{
    font-family:'Inter',sans-serif; font-weight:600; font-size:12.5px;
    padding:7px 13px; border-radius:20px; border:1px solid var(--line);
    background:#241b13; color:var(--ink-soft); cursor:pointer; transition:all .15s ease;
    flex-shrink:0;
  }
  #refresh-btn:hover{color:var(--ink); border-color:var(--accent); transform:translateY(-1px); box-shadow:0 6px 16px rgba(201,160,106,0.18);}
  #refresh-btn:active{transform:scale(0.93);}
  #refresh-btn.spinning{animation:spin .7s linear infinite;}
  @keyframes spin{from{transform:rotate(0deg);} to{transform:rotate(360deg);}}

  main{max-width:1180px; margin:0 auto; padding:26px 22px 80px;}
  .page{display:none; animation:fadein .35s ease;}
  .page.active{display:block;}
  @keyframes fadein{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}

  .page-header{margin-bottom:22px;}
  .page-header h2{font-size:26px; letter-spacing:-0.01em;}
  .page-header p{color:var(--ink-soft); font-size:14.5px; margin-top:4px; max-width:640px;}

  .grid{display:grid; gap:16px;}
  .grid-4{grid-template-columns:repeat(4,1fr);}
  .grid-2{grid-template-columns:1.3fr 1fr;}
  @media (max-width:900px){ .grid-4{grid-template-columns:repeat(2,1fr);} .grid-2{grid-template-columns:1fr;} }
  @media (max-width:560px){ .grid-4{grid-template-columns:1fr;} }

  .card{
    background:var(--card); border:1px solid var(--line); border-radius:14px;
    padding:18px 20px; transition:transform .2s ease, box-shadow .2s ease, border-color .2s ease;
  }
  .card:hover{transform:translateY(-2px); box-shadow:0 14px 30px rgba(0,0,0,0.35); border-color:#5c4a36;}
  .stat-card .label{font-size:12px; color:var(--ink-soft); font-family:'IBM Plex Mono',monospace; letter-spacing:0.04em; text-transform:uppercase;}
  .stat-card .value{font-family:'Sora',sans-serif; font-weight:700; font-size:32px; margin-top:6px; letter-spacing:-0.01em;}
  .stat-card .sub{font-size:12.5px; color:var(--ink-soft); margin-top:4px;}

  .card h3{font-size:15px; margin-bottom:14px;}
  canvas{max-width:100%;}

  table{width:100%; border-collapse:collapse; font-size:13.5px;}
  th{
    text-align:left; font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:0.04em;
    text-transform:uppercase; color:var(--ink-soft); padding:8px 10px; border-bottom:1px solid var(--line);
    cursor:pointer; user-select:none; white-space:nowrap;
  }
  th:hover{color:var(--ink);}
  td{padding:9px 10px; border-bottom:1px solid var(--line); vertical-align:top;}
  tr:last-child td{border-bottom:none;}
  tr:hover td{background:#241b13;}

  .pill{display:inline-block; padding:2px 9px; border-radius:20px; font-size:11.5px; font-weight:600;}
  .pill.win{background:var(--good-soft); color:var(--good);}
  .pill.loss{background:var(--bad-soft); color:var(--bad);}
  .pill.draw{background:#3a3122; color:#d8bf87;}
  .pill.unknown{background:#332a20; color:#96876f;}
  .pill.ohsr{background:var(--accent-soft); color:var(--accent);}

  .bar-row{display:flex; align-items:center; gap:10px; margin-bottom:9px;}
  .bar-row .name{width:110px; font-size:13px; font-weight:600; flex-shrink:0;}
  .bar-track{flex:1; height:9px; background:#332a20; border-radius:6px; overflow:hidden;}
  .bar-fill{height:100%; background:var(--accent); border-radius:6px; transition:width 1s cubic-bezier(.2,.8,.2,1);}
  .bar-val{width:52px; text-align:right; font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--ink-soft); flex-shrink:0;}

  input[type="text"], select{
    font-family:'Inter',sans-serif; font-size:13.5px; padding:8px 12px; border-radius:8px;
    border:1px solid var(--line); background:#241b13; color:var(--ink);
  }
  .filters{display:flex; gap:10px; margin-bottom:16px; flex-wrap:wrap;}

  .quote-box{
    background:linear-gradient(135deg, #3a2b1c 0%, #6b4a2e 100%); color:var(--ink);
    border:1px solid var(--line);
    border-radius:14px; padding:22px 24px; position:relative; overflow:hidden;
  }
  .quote-box .tag{font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:0.08em; text-transform:uppercase; opacity:0.75; color:var(--accent);}
  .quote-box .text{font-family:'Sora',sans-serif; font-size:19px; font-weight:600; margin-top:10px; line-height:1.4;}
  .quote-box button{
    margin-top:14px; background:rgba(255,255,255,0.1); border:1px solid rgba(255,255,255,0.22);
    color:var(--ink); padding:7px 14px; border-radius:20px; font-size:12.5px; font-weight:600; cursor:pointer;
    transition:background .2s ease, transform .15s ease;
  }
  .quote-box button:hover{background:rgba(255,255,255,0.18); transform:translateY(-1px);}
  .quote-box button:active{transform:scale(0.93);}

  .winningest-card{
    max-width:420px; margin-left:auto; margin-right:auto;
    text-align:center; position:relative; overflow:hidden;
    background:radial-gradient(circle at 50% 0%, #4a3a26 0%, var(--card) 70%);
    border:1px solid var(--accent); border-radius:16px; padding:26px 24px;
    box-shadow:0 0 0 1px rgba(201,160,106,0.08), 0 18px 40px rgba(0,0,0,0.35);
  }
  .winningest-tag{
    font-family:'IBM Plex Mono',monospace; font-size:11.5px; letter-spacing:0.1em; text-transform:uppercase;
    color:var(--accent); margin-bottom:10px;
  }
  .winningest-name{
    font-family:'Sora',sans-serif; font-weight:800; font-size:34px; letter-spacing:-0.01em;
    background:linear-gradient(180deg, #f0e6d8 0%, var(--accent) 120%);
    -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
  }
  .winningest-stat{margin-top:8px; font-size:14px; color:var(--ink);}
  .winningest-sub{margin-top:2px; font-size:11px; color:var(--ink-soft); font-family:'IBM Plex Mono',monospace;}

  .h2h-table td, .h2h-table th{text-align:center;}
  .h2h-table td:first-child, .h2h-table th:first-child{text-align:left;}

  .pilot-item{border:1px solid var(--line); border-radius:10px; margin-bottom:8px; overflow:hidden;}
  .pilot-header{
    width:100%; display:flex; align-items:center; gap:12px; padding:12px 14px;
    background:transparent; border:none; cursor:pointer; text-align:left; color:var(--ink);
    transition:background .15s ease;
  }
  .pilot-header:hover{background:#241b13;}
  .pilot-header .chevron{
    font-size:11px; color:var(--ink-soft); transition:transform .25s ease; flex-shrink:0; width:12px;
  }
  .pilot-item.open .pilot-header .chevron{transform:rotate(90deg);}
  .pilot-header .pname{font-weight:700; font-size:14px; flex:1;}
  .pilot-header .psub{font-size:12px; color:var(--ink-soft); font-family:'IBM Plex Mono',monospace;}
  .pilot-body{
    max-height:0; overflow:hidden; transition:max-height .3s ease;
  }
  .pilot-item.open .pilot-body{max-height:2000px;}
  .pilot-body-inner{padding:0 14px 12px;}
  .pilot-row{display:flex; align-items:center; gap:10px; padding:6px 0; border-top:1px solid var(--line);}
  .pilot-row .pcname{flex:1; font-size:13px; font-weight:600; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .pilot-row .pcstat{flex-shrink:0; font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--ink-soft); text-align:right; width:110px;}
  .pilot-row .pcstat b{color:var(--accent); font-size:13px;}

  .stat-callout{
    border-radius:10px; padding:12px 14px; font-size:13px; line-height:1.5;
  }
  .stat-callout-red{
    background:var(--bad-soft); border:1px solid var(--bad); color:var(--ink);
  }
  .stat-callout-red strong{color:var(--bad);}
  .stat-callout-green{
    background:var(--good-soft); border:1px solid var(--good); color:var(--ink);
  }
  .stat-callout-green strong{color:var(--good);}
  .h2h-cell{font-family:'IBM Plex Mono',monospace; font-size:12px;}
  .h2h-cell .pct{font-weight:700; color:var(--accent);}

  .vote-link{position:relative; display:inline-block;}
  .vote-link::after{content:''; position:absolute; left:0; bottom:-3px; width:0; height:1.5px; background:var(--accent); transition:width .25s cubic-bezier(.2,.8,.2,1);}
  .vote-link:hover::after{width:100%;}

  #toast-view-btn{transition:transform .15s ease, background .2s ease;}
  #toast-view-btn:hover{transform:translateY(-1px); background:#dab27e !important;}
  #toast-view-btn:active{transform:scale(0.92);}

  .badge-2hg{display:inline-block; background:#4a3a1c; color:#dcb676; font-size:11px; font-weight:700; padding:2px 8px; border-radius:6px; font-family:'IBM Plex Mono',monospace;}

  .empty-note{
    border:1.5px dashed var(--line); border-radius:12px; padding:22px; text-align:center;
    color:var(--ink-soft); font-size:13.5px; background:#221a13;
  }

  footer{max-width:1180px; margin:0 auto; padding:20px 22px 50px; color:var(--ink-soft); font-size:12px; text-align:center;}
</style>
</head>
<body>

<div id="topbar">
  <div class="brand">
    <div class="brand-mark"></div>
    <div>
      <h1>Friday Night Commander</h1>
      <span id="status-line">loading data…</span>
    </div>
  </div>
  <nav id="nav"></nav>
  <button id="refresh-btn" title="Re-fetch the latest data from the sheet">↻ Refresh</button>
</div>

<main>
  <section class="page" id="page-overview"></section>
  <section class="page" id="page-commanders"></section>
  <section class="page" id="page-players"></section>
  <section class="page" id="page-ohsr"></section>
  <section class="page" id="page-2hg"></section>
  <section class="page" id="page-gamelog"></section>
</main>

<footer>Magic With The Bois</footer>

<script>

function rowsArrayToObjects(arr) {
  const header = arr[0];
  return arr.slice(1).map(row => {
    const obj = {};
    header.forEach((h, i) => obj[h] = row[i]);
    return obj;
  });
}

function tryExtractDate(s) {
  const m = s.match(/(\d{1,2})\/(\d{1,2})\/(\d{2,4})/);
  if (!m) return null;
  let [, mo, d, y] = m;
  y = parseInt(y, 10); if (y < 100) y += 2000;
  const dt = new Date(y, parseInt(mo, 10) - 1, parseInt(d, 10));
  return isNaN(dt.getTime()) ? null : dt;
}
function isStrictDate(s) { return /^\d{1,2}\/\d{1,2}\/\d{4}$/.test(s.trim()); }
function hasQuoteText(s) {
  const stripped = s
    .replace(/\d{1,2}\/\d{1,2}\/\d{2,4}/g, '')
    .replace(/[\s\-\u2013\u2014:.,!'"]+/g, '');
  return stripped.length > 0;
}

function cleanData(objRows) {
  let curDate = null, curGameLabel = null, currentGame = null;
  const games = [], quotes = [];

  function startNewGame(dateVal) {
    currentGame = { date: dateVal, format: 'FFA', totalTurns: null, gameLengthMin: null, players: [] };
    games.push(currentGame);
  }

  for (const r of objRows) {
    const dateCell = (r['Date'] || '').toString().trim();
    const gameCell = (r['Game'] || '').toString().trim();
    const playerCell = (r['Player'] || '').toString().trim();
    const commanderCell = (r['Commander'] || '').toString().trim();
    const winCell = (r['Win'] || '').toString().trim();
    const noteCell = (r['Notes'] || '').toString().trim();
    const turnOrderCell = (r['Turn Order'] || '').toString().trim();
    const elimTurnCell = (r['Eliminated Turn'] || '').toString().trim();
    const totalTurnsCell = (r['Total Turns'] || '').toString().trim();
    const gameLengthCell = (r['Game Length (min)'] || '').toString().trim();

    let gameLabelChanged = false;
    if (dateCell) {
      if (isStrictDate(dateCell)) {
        curDate = tryExtractDate(dateCell);
      } else {
        const extracted = tryExtractDate(dateCell);
        if (extracted) curDate = extracted;
        if (hasQuoteText(dateCell)) quotes.push({ date: curDate, text: dateCell });
      }
    }
    if (gameCell) {
      const label = gameCell.toLowerCase().replace(/:$/, '').trim();
      if (label !== curGameLabel) gameLabelChanged = true;
      curGameLabel = label;
    }

    if (playerCell) {
      const shouldStartNew = !currentGame || gameLabelChanged ||
        currentGame.players.some(p => p.name === playerCell);
      if (shouldStartNew) startNewGame(curDate);

      let commander = commanderCell || null;
      if (commander === '~Unknown') commander = null;

      const winLower = winCell.toLowerCase();
      let result = null;
      if (winLower === 'yes') result = 'win';
      else if (winLower === 'draw') result = 'draw';

      const ohsr = /ohsr/i.test(noteCell);
      const is2hg = /2hg/i.test(noteCell);
      let team = null;
      const tm = noteCell.match(/team\s*([12])/i);
      if (tm) team = parseInt(tm[1], 10);
      let leftoverNote = noteCell.replace(/ohsr|2hg|;/gi, '').replace(/team\s*[12]/gi, '').trim().replace(/^[,;\s]+|[,;\s]+$/g, '');

      if (is2hg) currentGame.format = '2HG';

      currentGame.players.push({
        name: playerCell, commander, result, ohsr, team,
        note: leftoverNote || null,
        turnOrder: turnOrderCell ? parseInt(turnOrderCell, 10) : null,
        eliminatedTurn: elimTurnCell ? parseInt(elimTurnCell, 10) : null,
      });

      if (totalTurnsCell) currentGame.totalTurns = parseInt(totalTurnsCell, 10);
      if (gameLengthCell) currentGame.gameLengthMin = parseFloat(gameLengthCell);
    }
  }

  for (const g of games) {
    const hasDeclared = g.players.some(p => p.result === 'win' || p.result === 'draw');
    if (hasDeclared) for (const p of g.players) if (p.result === null) p.result = 'loss';
  }
  games.forEach((g, i) => { g.id = i + 1; g.podSize = g.players.length; });

  return { games, quotes: dedupeQuotes(quotes) };
}

function dedupeQuotes(quotes) {
  const seen = new Set();
  const out = [];
  for (const q of quotes) {
    if (seen.has(q.text)) continue;
    seen.add(q.text);
    out.push(q);
  }
  return out;
}

// ============================================================
// SCRYFALL INTEGRATION
// Looks up commander color identity + card art via Scryfall's public
// API. Runs client-side, after the page has already rendered with
// stats — this only adds visual polish on top, never blocks anything.
// ============================================================
const SCRYFALL_CACHE_KEY = 'fnc-scryfall-cache-v2';
let SCRYFALL = {}; // name -> { colors, cmc, typeLine, art }

function loadScryfallCache() {
  try {
    const raw = localStorage.getItem(SCRYFALL_CACHE_KEY);
    if (raw) SCRYFALL = JSON.parse(raw);
  } catch (e) { SCRYFALL = {}; }
}
function saveScryfallCache() {
  try { localStorage.setItem(SCRYFALL_CACHE_KEY, JSON.stringify(SCRYFALL)); } catch (e) {}
}

function chunk(arr, size) {
  const out = [];
  for (let i = 0; i < arr.length; i += size) out.push(arr.slice(i, i + size));
  return out;
}

async function fetchScryfallBatch(names) {
  try {
    const res = await fetch('https://api.scryfall.com/cards/collection', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ identifiers: names.map(n => ({ name: n })) }),
    });
    if (!res.ok) return;
    const json = await res.json();
    for (const card of json.data || []) {
      const faceImgs = (card.card_faces && card.card_faces[0] && card.card_faces[0].image_uris) || null;
      const art = (card.image_uris && card.image_uris.art_crop) || (faceImgs && faceImgs.art_crop) || null;
      const borderCrop = (card.image_uris && card.image_uris.border_crop) || (faceImgs && faceImgs.border_crop) || null;
      SCRYFALL[card.name] = {
        colors: card.color_identity || [],
        cmc: card.cmc != null ? card.cmc : null,
        typeLine: card.type_line || '',
        art,
        borderCrop,
      };
    }
  } catch (e) { /* offline, blocked, or Scryfall hiccup — fail silently, site works fine without it */ }
}

async function enrichWithScryfall(names, onProgress) {
  loadScryfallCache();
  const missing = names.filter(n => !SCRYFALL[n]);
  if (missing.length) {
    for (const batch of chunk(missing, 75)) {
      await fetchScryfallBatch(batch);
      if (onProgress) onProgress();
    }
    saveScryfallCache();
  } else if (onProgress) {
    onProgress();
  }
}

function colorPips(colors) {
  if (!colors || !colors.length) return '<span class="mana-pip mana-C" title="Colorless"></span>';
  const order = 'WUBRG';
  const sorted = [...colors].sort((a, b) => order.indexOf(a) - order.indexOf(b));
  return sorted.map(c => `<span class="mana-pip mana-${c}"></span>`).join('');
}

function colorIdentityLabel(colors) {
  if (!colors || !colors.length) return 'Colorless';
  const order = 'WUBRG';
  const sorted = [...colors].sort((a, b) => order.indexOf(a) - order.indexOf(b));
  if (sorted.length === 5) return 'WUBRG (5-color)';
  if (sorted.length === 1) return 'Mono-' + sorted[0];
  return sorted.join('');
}

function fmtDate(d) {
  if (!d) return '—';
  const dt = (d instanceof Date) ? d : new Date(d);
  return dt.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
}

function playerStats(games) {
  const stats = {};
  for (const g of games) {
    if (g.format !== 'FFA') continue;
    for (const p of g.players) {
      stats[p.name] = stats[p.name] || { name: p.name, games: 0, wins: 0, draws: 0, ohsrGames: 0, ohsrWins: 0 };
      const s = stats[p.name];
      s.games++;
      if (p.result === 'win') s.wins++;
      if (p.result === 'draw') s.draws++;
      if (p.ohsr) { s.ohsrGames++; if (p.result === 'win') s.ohsrWins++; }
    }
  }
  return Object.values(stats).map(s => ({ ...s, winRate: s.games ? s.wins / s.games : 0 }))
    .sort((a, b) => b.winRate - a.winRate);
}

function commanderStats(games) {
  const stats = {};
  for (const g of games) {
    if (g.format !== 'FFA') continue;
    for (const p of g.players) {
      if (!p.commander) continue;
      stats[p.commander] = stats[p.commander] || { name: p.commander, games: 0, wins: 0, pilots: new Set() };
      const s = stats[p.commander];
      s.games++;
      if (p.result === 'win') s.wins++;
      s.pilots.add(p.name);
    }
  }
  return Object.values(stats).map(s => ({ ...s, pilots: [...s.pilots], winRate: s.games ? s.wins / s.games : 0 }))
    .sort((a, b) => b.games - a.games);
}

function playerCommanderStats(games) {
  const stats = {};
  for (const g of games) {
    if (g.format !== 'FFA') continue;
    for (const p of g.players) {
      if (!p.commander) continue;
      const key = p.name + '‖' + p.commander;
      stats[key] = stats[key] || { player: p.name, commander: p.commander, games: 0, wins: 0 };
      const s = stats[key];
      s.games++;
      if (p.result === 'win') s.wins++;
    }
  }
  return Object.values(stats).map(s => ({ ...s, winRate: s.games ? s.wins / s.games : 0 }))
    .sort((a, b) => b.games - a.games);
}

function headToHead(games, players) {
  const table = {};
  players.forEach(a => { table[a] = {}; players.forEach(b => table[a][b] = { together: 0, aWins: 0 }); });
  for (const g of games) {
    if (g.format !== 'FFA') continue;
    const names = g.players.map(p => p.name);
    for (const a of names) for (const b of names) {
      if (a === b) continue;
      if (!table[a] || !table[a][b]) continue;
      table[a][b].together++;
      const aRes = g.players.find(p => p.name === a).result;
      if (aRes === 'win') table[a][b].aWins++;
    }
  }
  return table;
}

function ohsrSummary(games) {
  let withOhsr = { games: 0, wins: 0 }, without = { games: 0, wins: 0 };
  for (const g of games) {
    if (g.format !== 'FFA') continue;
    for (const p of g.players) {
      if (p.result === null) continue;
      const bucket = p.ohsr ? withOhsr : without;
      bucket.games++;
      if (p.result === 'win') bucket.wins++;
    }
  }
  return { withOhsr, without };
}

function ohsrByPlayer(games) {
  const stats = {};
  for (const g of games) {
    if (g.format !== 'FFA') continue;
    for (const p of g.players) {
      if (p.result === null) continue;
      stats[p.name] = stats[p.name] || { name: p.name, ohsrGames: 0, ohsrWins: 0, otherGames: 0, otherWins: 0 };
      const s = stats[p.name];
      if (p.ohsr) { s.ohsrGames++; if (p.result === 'win') s.ohsrWins++; }
      else { s.otherGames++; if (p.result === 'win') s.otherWins++; }
    }
  }
  return Object.values(stats).map(s => ({
    ...s,
    ohsrRate: s.ohsrGames ? s.ohsrWins / s.ohsrGames : null,
    otherRate: s.otherGames ? s.otherWins / s.otherGames : null,
  }));
}

function ohsrByPodSize(games) {
  const stats = {};
  for (const g of games) {
    if (g.format !== 'FFA') continue;
    for (const p of g.players) {
      if (p.result === null) continue;
      const key = g.podSize;
      stats[key] = stats[key] || { podSize: key, ohsrGames: 0, ohsrWins: 0, otherGames: 0, otherWins: 0 };
      const s = stats[key];
      if (p.ohsr) { s.ohsrGames++; if (p.result === 'win') s.ohsrWins++; }
      else { s.otherGames++; if (p.result === 'win') s.otherWins++; }
    }
  }
  return Object.values(stats).sort((a, b) => a.podSize - b.podSize);
}

// Abramowitz & Stegun 7.1.26 approximation of the error function
function erf(x) {
  const sign = x < 0 ? -1 : 1;
  x = Math.abs(x);
  const a1 = 0.254829592, a2 = -0.284496736, a3 = 1.421413741, a4 = -1.453152027, a5 = 1.061405429, p = 0.3275911;
  const t = 1 / (1 + p * x);
  const y = 1 - (((((a5 * t + a4) * t) + a3) * t + a2) * t + a1) * t * Math.exp(-x * x);
  return sign * y;
}
function normalCDF(x) { return 0.5 * (1 + erf(x / Math.sqrt(2))); }

// Two-proportion z-test: is the gap between two observed win rates
// larger than sampling noise alone would explain?
function twoProportionZTest(x1, n1, x2, n2) {
  if (!n1 || !n2) return null;
  const p1 = x1 / n1, p2 = x2 / n2;
  const pooled = (x1 + x2) / (n1 + n2);
  const se = Math.sqrt(pooled * (1 - pooled) * (1 / n1 + 1 / n2));
  if (se === 0) return { z: 0, pValue: 1, significant: false, lowPower: true };
  const z = (p1 - p2) / se;
  const pValue = 2 * (1 - normalCDF(Math.abs(z)));
  // rule of thumb: normal approximation gets shaky when expected successes/failures < 5
  const lowPower = (n1 * pooled < 5) || (n1 * (1 - pooled) < 5) || (n2 * pooled < 5) || (n2 * (1 - pooled) < 5);
  return { z, pValue, significant: pValue < 0.05, lowPower };
}

function lastSessionSummary(games, quotes) {
  const dated = games.filter(g => g.date);
  if (!dated.length) return null;
  const maxTime = Math.max(...dated.map(g => g.date.getTime()));
  const session = dated.filter(g => g.date.getTime() === maxTime);

  const winCounts = {};
  const commanders = new Set();
  let ohsrCount = 0, drawCount = 0, undecidedCount = 0;
  let longest = null;

  for (const g of session) {
    let gameHasDraw = false, gameUndecided = true;
    for (const p of g.players) {
      if (p.commander) commanders.add(p.commander);
      if (p.ohsr) ohsrCount++;
      if (p.result === 'win') { winCounts[p.name] = (winCounts[p.name] || 0) + 1; gameUndecided = false; }
      if (p.result === 'draw') gameHasDraw = true;
      if (p.result !== null) gameUndecided = false;
    }
    if (gameHasDraw) drawCount++;
    if (gameUndecided) undecidedCount++;
    if (g.totalTurns && (!longest || g.totalTurns > longest.totalTurns)) longest = g;
  }

  const winners = Object.entries(winCounts).sort((a, b) => b[1] - a[1]);
  const sessionQuotes = quotes.filter(q => q.date && q.date.getTime() === maxTime).map(q => q.text);

  return {
    date: new Date(maxTime),
    gameCount: session.length,
    winners,
    commanderCount: commanders.size,
    ohsrCount,
    drawCount,
    undecidedCount,
    longest,
    candidateQuotes: sessionQuotes,
  };
}

function animateNumber(el, target, decimals = 0, suffix = '') {
  const start = 0, duration = 900, startTime = performance.now();
  function tick(now) {
    const p = Math.min(1, (now - startTime) / duration);
    const eased = 1 - Math.pow(1 - p, 3);
    const val = start + (target - start) * eased;
    el.textContent = val.toFixed(decimals) + suffix;
    if (p < 1) requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}

function buildNav() {
  const nav = document.getElementById('nav');
  nav.innerHTML = '<div id="nav-indicator"></div>' + PAGES.map(p => `<button data-page="${p.id}">${p.label}</button>`).join('');
  nav.querySelectorAll('button').forEach(btn => {
    btn.addEventListener('click', () => showPage(btn.dataset.page));
  });
  window.addEventListener('resize', () => moveNavIndicator(document.querySelector('#nav button.active')));
}

function moveNavIndicator(activeBtn) {
  const indicator = document.getElementById('nav-indicator');
  if (!indicator || !activeBtn) return;
  indicator.style.left = activeBtn.offsetLeft + 'px';
  indicator.style.width = activeBtn.offsetWidth + 'px';
}

function showPage(id) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  let activeBtn = null;
  document.querySelectorAll('#nav button').forEach(b => {
    const isActive = b.dataset.page === id;
    b.classList.toggle('active', isActive);
    if (isActive) activeBtn = b;
  });
  document.getElementById('page-' + id).classList.add('active');
  location.hash = id;
  requestAnimationFrame(() => moveNavIndicator(activeBtn));
  RENDERERS[id]();
}

  document.getElementById('pilot-search').addEventListener('input', renderPilotAccordion);

  const pilotNamesNeeded = [...new Set(pairings.map(p => p.commander))].filter(n => !SCRYFALL[n]);
  if (pilotNamesNeeded.length) {
    enrichWithScryfall(pilotNamesNeeded, () => {
      if (document.getElementById('page-players').classList.contains('active')) renderPilotAccordion();
    });
  }
}

function ohsrSignificanceText(withOhsr, without, wRate, woRate) {
  const test = twoProportionZTest(withOhsr.wins, withOhsr.games, without.wins, without.games);
  if (!test) return { className: 'stat-callout-red', html: 'Not enough data yet to test significance.' };
  const gapPts = Math.abs(wRate - woRate) * 100;
  const pStr = test.pValue < 0.001 ? '< 0.001' : test.pValue.toFixed(3);
  if (test.significant) {
    return {
      className: 'stat-callout-green',
      html: `<strong>Statistically significant</strong> (two-proportion z-test, p = ${pStr}) — a gap this size (${gapPts.toFixed(0)} points) is unlikely to be random chance at your current sample size.${test.lowPower ? ' That said, one or both groups are still small enough that this result should be treated cautiously.' : ''}`,
    };
  }
  return {
    className: 'stat-callout-red',
    html: `<strong>Not statistically significant</strong> (two-proportion z-test, p = ${pStr}) — with ${withOhsr.games} OHSR games logged, a ${gapPts.toFixed(0)}-point gap could plausibly happen by chance alone. More games would sharpen this.`,
  };
}

function getField(obj, name) {
  const key = Object.keys(obj || {}).find(k => k.trim().toLowerCase() === name.toLowerCase());
  return key ? (obj[key] || '').toString().trim() : '';
}
function normalizeQuoteText(s) {
  return (s || '').toString().trim()
    .replace(/^[“”"']+|[“”"']+$/g, '')
    .replace(/\s+/g, ' ').toLowerCase();
}
function tallyVotesForSession(votes, sessionDate) {
  const counts = {}; // normalized text -> { text, count }
  if (!sessionDate) return counts;
  for (const v of votes) {
    const dateStr = getField(v, 'Session Date');
    const quoteStr = getField(v, 'Episode Name');
    if (!dateStr || !quoteStr) continue;
    const d = tryExtractDate(dateStr) || (isStrictDate(dateStr) ? new Date(dateStr) : null);
    if (!d || d.toDateString() !== sessionDate.toDateString()) continue;
    const norm = normalizeQuoteText(quoteStr);
    if (!norm) continue;
    counts[norm] = counts[norm] || { text: quoteStr.trim(), count: 0 };
    counts[norm].count++;
  }
  return counts;
}

function escapeHtml(s) {
  return (s || '').toString().replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function renderEpisodePoll(recap) {
  const el = document.getElementById('episode-poll');
  if (!el) return;

  const counts = tallyVotesForSession(STATE.votes, recap.date);
  const seen = new Set();
  const options = [];
  for (const text of recap.candidateQuotes) {
    const norm = normalizeQuoteText(text);
    if (seen.has(norm)) continue;
    seen.add(norm);
    options.push({ text, count: counts[norm] ? counts[norm].count : 0 });
  }
  // include any voted-for text that wasn't among the logged quotes (typed in fresh)
  for (const norm in counts) {
    if (seen.has(norm)) continue;
    seen.add(norm);
    options.push({ text: counts[norm].text, count: counts[norm].count });
  }

  if (!options.length) {
    el.innerHTML = `<div class="empty-note" style="padding:14px;">No candidate quotes logged for this session yet — next Friday's chaos will supply some.</div>`;
    return;
  }

  options.sort((a, b) => b.count - a.count);
  const totalVotes = options.reduce((a, o) => a + o.count, 0);
  const maxCount = Math.max(...options.map(o => o.count), 1);

  el.innerHTML = options.map((o, i) => `
    <div class="bar-row" style="margin-bottom:8px;">
      <div class="name" style="width:auto; flex:1; font-weight:${i===0 && o.count>0 ? 700 : 500}; font-size:12.5px; font-style:italic;">
        ${i===0 && o.count>0 ? '🏆 ' : ''}“${escapeHtml(o.text)}”
      </div>
      <div class="bar-track" style="width:70px; flex:none;"><div class="bar-fill" style="width:${(o.count/maxCount*100).toFixed(0)}%;"></div></div>
      <div class="bar-val" style="width:30px;">${o.count}</div>
    </div>
  `).join('') + (totalVotes === 0
    ? `<div class="sub" style="margin-top:2px;">No votes yet — be the first.</div>`
    : `<div class="sub" style="margin-top:2px;">${totalVotes} vote${totalVotes>1?'s':''} cast</div>`
  ) + (VOTE_FORM_URL.indexOf('REPLACE_WITH') === 0
    ? `<div class="sub" style="margin-top:8px;">Voting isn't connected yet — see the README to set up the Episode Name Form.</div>`
    : '');
}

// ============================================================
// BOOTSTRAP + LIVE REFRESH
// ============================================================
let lastFetchOk = null;

function fmtTime(d) {
  return d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
}

let hasRenderedOnce = false;
let lastSignature = null;
function gamesSignature(games) {
  return games.length + ':' + (games[games.length - 1] ? games[games.length - 1].id : '') +
    ':' + games.reduce((a, g) => a + g.players.length, 0);
}

function applyData(objRows, voteRows, sourceLabel, isLive) {
  const cleaned = cleanData(objRows);
  const currentPage = (location.hash || '#overview').replace('#', '');
  const sig = gamesSignature(cleaned.games);
  const changed = sig !== lastSignature;
  const prevGameCount = STATE.games.length;
  STATE = { ...cleaned, votes: voteRows || [] };
  lastSignature = sig;
  const now = new Date();
  lastFetchOk = isLive;
  document.getElementById('status-line').textContent =
    `${STATE.games.length} games · ${sourceLabel} · updated ${fmtTime(now)}`;
  if (!document.querySelector('#nav button')) buildNav();

  if (!hasRenderedOnce || changed) {
    const target = PAGES.some(p => p.id === currentPage) ? currentPage : 'overview';
    showPage(target);
    if (hasRenderedOnce && changed && STATE.games.length > prevGameCount) {
      showNewSessionToast(STATE.games.length - prevGameCount);
    }
    hasRenderedOnce = true;
  } else if (currentPage === 'overview') {
    // votes can change even when game count doesn't; keep the poll live
    renderSessionRecap();
  }
}

function fetchVotesAndApply(objRows, sourceLabel, isLive, onDone) {
  if (!VOTES_CSV_URL || VOTES_CSV_URL.indexOf('REPLACE_WITH') === 0) {
    applyData(objRows, [], sourceLabel, isLive);
    onDone();
    return;
  }
  const vUrl = VOTES_CSV_URL + (VOTES_CSV_URL.includes('?') ? '&' : '?') + '_ts=' + Date.now();
  Papa.parse(vUrl, {
    download: true, header: true,
    complete: (vres) => { applyData(objRows, vres.data, sourceLabel, isLive); onDone(); },
    error: () => { applyData(objRows, [], sourceLabel, isLive); onDone(); },
  });
}

function loadLive(isManual) {
  const btn = document.getElementById('refresh-btn');
  if (isManual && btn) btn.classList.add('spinning');
  const finishSpin = () => { if (btn) btn.classList.remove('spinning'); };

  if (!SHEET_CSV_URL || SHEET_CSV_URL.indexOf('REPLACE_WITH') === 0) {
    fetchVotesAndApply(rowsArrayToObjects(RAW_ROWS), 'embedded snapshot (connect your sheet in the config)', false, finishSpin);
    return;
  }
  // cache-bust so we always get the freshest published CSV, not a cached copy
  const url = SHEET_CSV_URL + (SHEET_CSV_URL.includes('?') ? '&' : '?') + '_ts=' + Date.now();
  Papa.parse(url, {
    download: true, header: true,
    complete: (res) => fetchVotesAndApply(res.data, 'live from Google Sheets', true, finishSpin),
    error: () => {
      if (!STATE.games.length) fetchVotesAndApply(rowsArrayToObjects(RAW_ROWS), 'embedded snapshot (live fetch failed)', false, finishSpin);
      else { document.getElementById('status-line').textContent =
        `${STATE.games.length} games · live fetch failed, showing last good data`; finishSpin(); }
    },
  });
}

document.getElementById('refresh-btn').addEventListener('click', () => loadLive(true));

loadLive(false);
// auto-refresh every 3 minutes so the site stays current if left open during a session
setInterval(() => loadLive(false), 3 * 60 * 1000);
</script>
</body>
