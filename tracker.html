<!DOCTYPE html>
<html lang="en">
<head>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FNC Tracker">
<meta name="theme-color" content="#1c1510">
<title>Friday Night Commander — Game Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#1c1510; --card:#2a2018; --ink:#f0e6d8; --ink-soft:#b3a08c; --line:#4a3a2c;
    --accent:#c9a06a; --accent-soft:#4a3a26; --good:#8faf6e; --good-soft:#2e3524; --bad:#c46a4e; --bad-soft:#3c2620;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; background:var(--bg); color:var(--ink); font-family:'Inter',sans-serif; -webkit-font-smoothing:antialiased;
    touch-action:manipulation; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;}
  body{min-height:100vh; padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);}
  h1,h2,h3{font-family:'Sora',sans-serif; margin:0;}
  .mono{font-family:'IBM Plex Mono',monospace;}
  input,select,textarea,button{font-family:inherit; font-size:17px; color:var(--ink);}
  input,select,textarea{-webkit-user-select:text; user-select:text; background:#241b13; border:1px solid var(--line); border-radius:10px; padding:12px 14px; width:100%;}
  textarea{resize:vertical; min-height:70px;}
  button{cursor:pointer; border:1px solid var(--line); background:#241b13; border-radius:12px; padding:12px 18px; font-weight:600; min-height:48px;}
  button:active{transform:scale(.96);}
  button.primary{background:var(--accent); color:#2a1c0f; border-color:var(--accent);}
  button.danger{background:var(--bad-soft); border-color:var(--bad); color:#f0c4b6;}
  button.ghost{background:transparent;}
  button:disabled{opacity:.4;}
  #topbar{display:flex; align-items:center; justify-content:space-between; gap:12px; padding:12px 18px; border-bottom:1px solid var(--line); background:rgba(28,21,16,.95);
    position:sticky; top:0; z-index:10;}
  #topbar h1{font-size:18px;}
  #sync{font-size:12.5px; font-family:'IBM Plex Mono',monospace; color:var(--ink-soft); display:flex; gap:8px; align-items:center;}
  .dot{width:10px; height:10px; border-radius:50%; background:#6b5a48; display:inline-block;}
  .dot.ok{background:var(--good);} .dot.bad{background:var(--bad);} .dot.wait{background:var(--accent);}
  main{max-width:1100px; margin:0 auto; padding:18px 18px 60px;}
  .card{background:var(--card); border:1px solid var(--line); border-radius:16px; padding:18px 20px; margin-bottom:16px;}
  .card h3{font-size:15px; margin-bottom:12px; color:var(--accent); letter-spacing:.04em; text-transform:uppercase;}
  .row{display:flex; gap:12px; align-items:center; flex-wrap:wrap;}
  .grow{flex:1; min-width:0;}
  .sub{color:var(--ink-soft); font-size:13.5px;}
  .seg{display:inline-flex; border:1px solid var(--line); border-radius:12px; overflow:hidden;}
  .seg button{border:0; border-radius:0; background:transparent;}
  .seg button.on{background:var(--accent); color:#2a1c0f;}
  .chips{display:flex; flex-wrap:wrap; gap:10px;}
  .chip{padding:12px 20px; border-radius:30px; font-size:17px;}
  .seat-n{width:34px; height:34px; border-radius:50%; background:var(--accent-soft); color:var(--accent); display:flex; align-items:center; justify-content:center; font-family:'IBM Plex Mono',monospace; font-weight:700; flex-shrink:0;}
  .seat-name{font-weight:700; font-size:19px; width:110px; flex-shrink:0;}
  .seat-row select{flex:1; min-width:220px;}
  .thumb{width:96px; height:68px; border-radius:8px; background:#3a2c20 center 30%/cover no-repeat; border:1px solid var(--line); flex-shrink:0; padding:0; min-height:0;}
  .iconbtn{width:46px; padding:0; min-height:46px;}
  /* setup extras */
  .seat-row{display:flex; align-items:center; gap:12px; padding:12px 0; border-top:1px solid var(--line); flex-wrap:wrap;}
  .seat-row:first-of-type{border-top:0;}
  .tbl{display:grid; gap:10px; padding:10px; border-radius:22px; background:#150f0a; border:1px solid var(--line);}
  .tseat{position:relative; display:flex; flex-direction:column; gap:8px; padding:10px; border-radius:16px; background:#2a2017 center 30%/cover no-repeat; border:2px dashed var(--line); min-width:0; min-height:0; overflow:hidden;}
  .tseat.filled{border:2px solid var(--accent-soft);}
  .tseat.filled::before{content:''; position:absolute; inset:0; background:rgba(14,10,7,.55); pointer-events:none;}
  .tseat > *{position:relative;}
  .tseat .head{display:flex; align-items:center; gap:8px;}
  .tseat .face{font-style:normal; color:var(--accent); font-size:14px;}
  .tseat select{padding:10px 8px; font-size:15px; min-width:0;}
  .tseat .name-sel{font-weight:700; font-size:17px;}
  .tseat .cmdrow{display:flex; gap:8px; align-items:stretch;}
  .tseat .cmdrow select{flex:1;}
  .tseat .thumb{width:62px; height:auto; min-height:44px;}
  .tseat .iconbtn{width:40px; min-height:40px; padding:0;}
  .laygrid{display:flex; flex-wrap:wrap; gap:14px;}
  .lay{padding:10px; width:176px; text-align:center; border-radius:14px;}
  .lay.on{border-color:var(--accent); background:var(--accent-soft);}
  .lay .mini{display:grid; gap:3px; height:96px; margin-bottom:8px;}
  .lay .mini>div{background:#3a2c20; border-radius:5px; display:flex; align-items:center; justify-content:center; gap:4px; font-size:11px; color:var(--ink-soft);}
  .lay .mini i{font-style:normal; font-size:10px; color:var(--accent); display:inline-block;}
  .lay .mini b{color:var(--ink); font-family:'IBM Plex Mono',monospace;}
  .lay .cap{font-size:13px; color:var(--ink-soft);}
  /* play: full-screen table */
  body.playing #topbar{display:none;}
  body.playing main{max-width:none; padding:0;}
  .table{position:fixed; inset:0; display:grid; gap:8px; background:#120d09;
    padding:calc(8px + env(safe-area-inset-top)) calc(8px + env(safe-area-inset-right)) calc(8px + env(safe-area-inset-bottom)) calc(8px + env(safe-area-inset-left));}
  .cell{position:relative; overflow:hidden; min-width:0; min-height:0; border-radius:22px;}
  .seat{position:absolute; border-radius:22px; overflow:hidden; background:#3a2c20 center 30%/cover no-repeat; border:3px solid transparent; --fs:90px;}
  .seat.cur{border-color:var(--accent); box-shadow:inset 0 0 0 3px rgba(201,160,106,.35), 0 0 22px rgba(201,160,106,.35);}
  .seat.out{filter:grayscale(.85) brightness(.55);}
  .seat .shade{position:absolute; inset:0; background:linear-gradient(180deg, rgba(0,0,0,.6) 0%, rgba(0,0,0,.2) 40%, rgba(0,0,0,.72) 100%);}
  .seat .who{position:absolute; top:10px; left:0; right:0; text-align:center; text-shadow:0 2px 8px #000; pointer-events:none; padding:0 8px;}
  .seat .who b{display:block; font-family:'Sora',sans-serif; font-size:calc(var(--fs)*.26); line-height:1.1;}
  .seat .who span{display:block; font-size:calc(var(--fs)*.15); opacity:.9; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .seat .who em{font-style:normal; margin-top:4px;}
  .lbtn{position:absolute; top:0; bottom:0; width:27%; border:0; border-radius:0; padding:0; background:rgba(0,0,0,.16); color:#fff; font-size:calc(var(--fs)*.7); font-weight:300; line-height:1;
    text-shadow:0 2px 10px #000; min-height:0; touch-action:none;}
  .lbtn.minus{left:0;} .lbtn.plus{right:0;}
  .lbtn:active{background:rgba(255,255,255,.2); transform:none;}
  .lbtn:disabled{opacity:.25;}
  .seat .center{position:absolute; left:27%; right:27%; top:0; bottom:0; display:flex; flex-direction:column; align-items:center; justify-content:center; padding-top:calc(var(--fs)*.25);}
  .seat .delta{height:calc(var(--fs)*.4); font-family:'Sora',sans-serif; font-weight:800; font-size:calc(var(--fs)*.36); line-height:1; text-shadow:0 2px 10px #000;}
  .delta.pos{color:#a8d680;} .delta.neg{color:#ff8a6a;}
  .delta.pop{animation:pop .3s ease-out;}
  @keyframes pop{0%{transform:translateY(8px) scale(.8); opacity:.2;} 100%{transform:none; opacity:1;}}
  .life{font-family:'Sora',sans-serif; font-weight:800; font-size:var(--fs); line-height:1; text-shadow:0 4px 22px #000, 0 0 6px #000;}
  .life.low{color:#ffd29a;} .life.dead{color:#ff8a6a;}
  .seat .foot{position:absolute; left:0; right:0; bottom:10px; display:flex; justify-content:center; gap:10px; pointer-events:none;}
  .seat .foot button{pointer-events:auto; min-height:0; padding:calc(var(--fs)*.12) calc(var(--fs)*.3); font-size:calc(var(--fs)*.2); border-radius:30px;}
  .seat .foot button[hidden]{display:none;}
  .seat .who{pointer-events:auto; cursor:pointer;}
  .seat .center{pointer-events:none;}
  .seat .life{pointer-events:auto; cursor:pointer;}
  .seat .bottom{position:absolute; left:0; right:0; bottom:10px; display:flex; flex-direction:column; align-items:center; gap:calc(var(--fs)*.07); pointer-events:none;}
  .seat .foot{position:static; display:flex; justify-content:center; gap:10px; pointer-events:none;}
  /* counter chips: stacked under the commander name, kept inside the centre column so they never reach the +/- buttons (27% each side) */
  .seat .who .cnts{display:flex; flex-direction:column; align-items:center; gap:4px; width:46%; max-width:46%; margin:6px auto 0; pointer-events:auto; cursor:pointer;}
  .seat .who .cnts.two{display:grid; grid-template-columns:repeat(2,max-content); justify-content:center; gap:4px 6px;}
  .seat .cnts[hidden]{display:none;}
  .seat .who .cchip{display:block; overflow:visible; opacity:1; background:rgba(20,14,9,.82); border:1.6px solid var(--c,#cdbfae); border-radius:16px; padding:2px 8px; font-size:max(9px, calc(var(--fs)*.12)); white-space:nowrap; line-height:1.3; text-shadow:none;}
  .seat .who .cchip b{display:inline; font-size:inherit; line-height:inherit; font-family:'Sora',sans-serif; margin-left:3px;}
  .cchip.lethal{background:var(--bad-soft); border-color:var(--bad); color:#ffd1c2;}
  /* player window */
  .pw-sec{margin:16px 0 6px; font-family:'Sora',sans-serif; font-weight:700; font-size:15px; color:var(--accent); letter-spacing:.04em; text-transform:uppercase;}
  .pw-sec .sub{text-transform:none; letter-spacing:0; font-family:'Inter',sans-serif; font-weight:400;}
  .pw-check{display:flex; align-items:center; gap:8px; margin-bottom:8px;}
  .pw-check input{width:22px; height:22px; padding:0;}
  .pw-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:10px;}
  .pw-tile{display:flex; align-items:center; gap:10px; background:#241b13; border:1px solid var(--line); border-radius:14px; padding:10px 12px;}
  .pw-tile .thumb{width:64px; height:46px;}
  .pw-t{font-weight:700; font-size:15px; line-height:1.2;}
  .pw-v{font-family:'Sora',sans-serif; font-weight:800; font-size:26px; min-width:42px; text-align:center;}
  .pw-tile.cnt.has{border-color:var(--c);}
  .pw-tile.lethal{border-color:var(--bad); background:var(--bad-soft);}
  .cdot{display:inline-block; width:10px; height:10px; border-radius:50%; background:var(--c); margin-right:7px;}
  .lethal-tag[hidden]{display:none;}
  .late{color:#ff3030 !important; background:#fff; padding:1px 8px; border-radius:8px; font-weight:800;}
  #buildtag{position:fixed;left:8px;bottom:4px;font:10px monospace;color:#ffffff66;z-index:5;pointer-events:none;}
  #hub{position:fixed; left:calc(14px + env(safe-area-inset-left)); top:calc(14px + env(safe-area-inset-top)); width:64px; height:64px; border-radius:50%; padding:0; z-index:20;
    background:rgba(28,21,16,.9); border:2px solid var(--accent); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:0; line-height:1.05; min-height:0;}
  #hub b{font-family:'Sora',sans-serif; font-size:20px;}
  #hub:active{transform:scale(.94);}
  /* results */
  .res{display:flex; align-items:center; gap:14px; padding:12px 0; border-top:1px solid var(--line); flex-wrap:wrap;}
  .res:first-of-type{border-top:0;}
  .win{border-color:var(--accent) !important; background:var(--accent-soft) !important;}
  .toggle{min-width:110px;}
  .toggle.on{background:var(--accent-soft); border-color:var(--accent); color:var(--accent);}
  /* modal */
  #modal{position:fixed; inset:0; background:rgba(0,0,0,.7); display:none; align-items:center; justify-content:center; z-index:50; padding:20px;}
  #modal.show{display:flex;}
  #modal .box{background:var(--card); border:1px solid var(--line); border-radius:18px; width:min(960px,100%); max-height:90vh; overflow:auto; padding:20px;}
  .artgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:12px; margin-top:14px;}
  .artopt{padding:0; border-radius:12px; overflow:hidden; text-align:left; background:#241b13; min-height:0; display:block;}
  .artopt.sel{outline:3px solid var(--accent);}
  .artopt img{display:block; width:100%; aspect-ratio:1.37; object-fit:cover;}
  .artopt .cap{padding:8px 10px; font-size:12.5px; color:var(--ink-soft);}
  .hit{display:block; width:100%; text-align:left; margin-bottom:8px;}
  .empty{border:1.5px dashed var(--line); border-radius:12px; padding:22px; text-align:center; color:var(--ink-soft);}
  .quote-item{padding:8px 0; border-top:1px solid var(--line); display:flex; gap:10px; align-items:center;}
  .quote-item:first-child{border-top:0;}

  /* ---------- celebration + game overview ---------- */
  body.celebrating{overflow:hidden;}
  .cele{position:fixed; inset:0; z-index:50; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:20px 20px 28px; overflow:hidden;
    background:
      radial-gradient(circle at 12% 18%, rgba(79,163,154,.30), transparent 38%),
      radial-gradient(circle at 88% 22%, rgba(192,73,47,.34), transparent 40%),
      radial-gradient(circle at 78% 88%, rgba(154,91,138,.26), transparent 38%),
      radial-gradient(circle at 18% 86%, rgba(226,178,74,.22), transparent 36%),
      radial-gradient(ellipse at 50% 36%, #7a4d27 0%, #43291a 38%, #1c1510 82%);}
  .cele::before{content:''; position:absolute; width:190vmax; height:190vmax; left:50%; top:34%; transform:translate(-50%,-50%); pointer-events:none;
    background:repeating-conic-gradient(from 0deg, rgba(255,214,120,.16) 0 5deg, transparent 5deg 15deg);
    -webkit-mask-image:radial-gradient(circle, #000 0, rgba(0,0,0,.5) 22%, transparent 58%); mask-image:radial-gradient(circle, #000 0, rgba(0,0,0,.5) 22%, transparent 58%);
    animation:celeSpin 80s linear infinite;}
  @keyframes celeSpin{to{transform:translate(-50%,-50%) rotate(360deg);}}
  .cele > *{position:relative;}
  .cele .trophy{height:min(44vh, 400px); width:auto; max-width:80vw; filter:drop-shadow(0 18px 30px rgba(0,0,0,.55)); animation:tropPop .9s cubic-bezier(.2,1.5,.4,1) both, tropFloat 4s ease-in-out .9s infinite;}
  @keyframes tropPop{0%{transform:scale(.1) rotate(-14deg); opacity:0;} 100%{transform:scale(1) rotate(0); opacity:1;}}
  @keyframes tropFloat{0%,100%{transform:translateY(0);} 50%{transform:translateY(-9px);}}
  .cele .shine{animation:shineSweep 3.2s ease-in-out 1.1s infinite;}
  @keyframes shineSweep{0%{transform:translateX(-120px);} 55%,100%{transform:translateX(420px);}}
  .cele .spark{transform-box:fill-box; transform-origin:center; animation:sparkle 2.2s ease-in-out infinite;}
  @keyframes sparkle{0%,100%{transform:scale(.2) rotate(0); opacity:0;} 50%{transform:scale(1) rotate(45deg); opacity:1;}}
  .cele .kicker{font:800 clamp(14px,2.2vw,20px) 'Sora',sans-serif; letter-spacing:.42em; text-transform:uppercase; color:#f0cf86; margin-top:8px; animation:riseIn .7s ease .6s both;}
  .cele h1{font:800 clamp(38px,7vw,76px)/1.04 'Sora',sans-serif; margin:6px 0 0; background:linear-gradient(180deg,#fff6cf 0%,#f0c35c 52%,#b57a2a 100%); -webkit-background-clip:text; background-clip:text; color:transparent; text-shadow:none; filter:drop-shadow(0 3px 0 rgba(60,30,8,.55)); animation:riseIn .7s ease .75s both;}
  .cele .who{display:flex; align-items:center; justify-content:center; gap:14px; margin-top:10px; animation:riseIn .7s ease .9s both;}
  .cele .medal{width:64px; height:64px; border-radius:50%; background:#3a2c20 center 30%/cover no-repeat; border:3px solid #e2b24a; box-shadow:0 0 0 4px rgba(226,178,74,.25), 0 6px 18px rgba(0,0,0,.5); flex-shrink:0;}
  .cele .wname{font:700 clamp(24px,4vw,40px) 'Sora',sans-serif; color:#fff2d6;}
  .cele .wcmd{font-size:clamp(14px,2vw,19px); color:#e2c9a2; margin-top:2px;}
  .cele .cont{margin-top:22px; font-size:22px; padding:16px 44px; border-radius:40px; box-shadow:0 8px 26px rgba(226,178,74,.35); animation:riseIn .7s ease 1.1s both;}
  .cele .csync{margin-top:12px; font-size:14px; color:#cdb48f; animation:riseIn .7s ease 1.2s both;}
  @keyframes riseIn{from{opacity:0; transform:translateY(18px);} to{opacity:1; transform:none;}}
  .rhead{display:flex; align-items:center; gap:16px; flex-wrap:wrap;}
  .rhead .mini-trophy{width:54px; height:auto; flex-shrink:0;}
  .rtiles{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:12px; margin-top:14px;}
  @media (max-width:560px){.rtiles{grid-template-columns:repeat(2,minmax(0,1fr));}}
  .rtile .v{overflow-wrap:anywhere;}
  .rtile{background:#241b13; border:1px solid var(--line); border-radius:14px; padding:12px 14px;}
  .rtile .v{font:800 26px 'Sora',sans-serif; color:var(--ink);} .rtile .l{font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-soft); margin-top:2px;}
  .rtile .s{font-size:13px; color:var(--ink-soft); margin-top:2px;}
  .rrow{display:flex; align-items:center; gap:12px; padding:10px 0; border-top:1px solid var(--line); flex-wrap:wrap;}
  .rrow:first-of-type{border-top:0;}
  .rrow .nm{font-weight:700; min-width:150px; flex:1 1 180px;} .rrow .nm small{display:block; font-weight:500; color:var(--ink-soft); font-size:13px;}
  .rrow .num{font-family:'IBM Plex Mono',monospace; font-size:15px; white-space:nowrap;}
  .pill{display:inline-block; padding:3px 10px; border-radius:20px; font:600 13px 'IBM Plex Mono',monospace; white-space:nowrap;}
  .pill.up{background:var(--good-soft); color:var(--good);} .pill.down{background:var(--bad-soft); color:var(--bad);} .pill.flat{background:#352a20; color:var(--ink-soft);}
  .pill.win{background:var(--accent-soft); color:var(--accent);} .pill.tag{background:#3a3020; color:#e2b24a;}
  .bar2{flex:1 1 200px; height:14px; background:#1d150f; border-radius:8px; overflow:hidden; display:flex; min-width:120px;}
  .bar2 > i{display:block; height:100%;}
  .hl{background:linear-gradient(90deg,var(--accent-soft),transparent); border-left:3px solid var(--accent); border-radius:8px; padding:10px 14px; margin-bottom:10px;}
  .rnote{color:var(--ink-soft); font-size:14px; padding:6px 0;}
  .rlist{display:flex; flex-direction:column; gap:8px;}
  .ritem{display:flex; gap:12px; align-items:flex-start; background:#241b13; border:1px solid var(--line); border-radius:12px; padding:10px 14px;}
  .ritem .ic{font-size:22px; line-height:1.2;}
  .spinner{display:inline-block; width:16px; height:16px; border:2px solid var(--line); border-top-color:var(--accent); border-radius:50%; animation:spin1 .9s linear infinite; vertical-align:-3px; margin-right:8px;}
  @keyframes spin1{to{transform:rotate(360deg);}}

  .badges-h{margin:18px 0 8px; font:700 13px 'Sora',sans-serif; letter-spacing:.1em; text-transform:uppercase; color:var(--accent);}
  .badges{display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:10px;}
  .badge{display:flex; gap:12px; align-items:center; background:linear-gradient(135deg,#3a2a1a,#241b13); border:1px solid #6b4f2e; border-radius:14px; padding:10px 14px;}
  .badge .bi{font-size:32px; width:46px; height:46px; flex:none; display:grid; place-items:center; border-radius:50%; background:radial-gradient(circle at 35% 30%,#f0c35c,#a8741f); box-shadow:0 2px 8px #0008, inset 0 0 0 2px #fff3;}
  .badge .bn{font:700 16px 'Sora',sans-serif; color:#f0c35c;} .badge .bw{font-size:13.5px; color:var(--ink-soft); margin-top:2px;} .badge .bw b{color:var(--ink);}
</style>
</head>
<body>
<div id="topbar">
  <h1>Friday Night Commander <span class="sub mono" style="font-size:12px;">· tracker</span></h1>
  <div class="row">
    <div id="sync"></div>
    <button id="btn-settings" class="ghost iconbtn" title="Settings">⚙︎</button>
  </div>
</div>
<main id="app"></main>
<div id="modal"><div class="box" id="modal-box"></div></div>

<script>
(function(){
  var KEY='fnc-tracker-v1';
  function wipe(){ try{ var o=JSON.parse(localStorage.getItem(KEY)||'{}'); var keep={cfg:o.cfg||{url:'',token:''},pending:o.pending||[]}; localStorage.setItem(KEY,JSON.stringify(keep)); }catch(e){ try{localStorage.removeItem(KEY);}catch(_){} } }
  if(/[?&]reset=1/.test(location.search)){ wipe(); location.replace(location.pathname); }
  window.__fncWipe=wipe;
  function banner(msg){
    if(document.getElementById('fnc-err'))return;
    var d=document.createElement('div'); d.id='fnc-err';
    d.style.cssText='position:fixed;left:0;right:0;bottom:0;z-index:99999;background:#7a1f1f;color:#fff;padding:14px 18px;font:16px -apple-system,sans-serif;display:flex;gap:14px;align-items:center;justify-content:center;';
    d.innerHTML='<span>Tracker hit an error: '+String(msg).replace(/</g,'&lt;')+'</span><button style="font-size:16px;padding:10px 16px;border-radius:10px;border:0;">Reset saved game &amp; reload</button>';
    d.querySelector('button').onclick=function(){ window.__fncWipe(); location.reload(); };
    document.body.appendChild(d);
  }
  window.addEventListener('error',function(e){ banner(e.message||'unknown'); });
  window.addEventListener('unhandledrejection',function(e){ banner((e.reason&&e.reason.message)||e.reason||'promise error'); });
})();

    pending: [], cfg: { url: '', token: '' }, results: null, recap: null, lastMsg: '' };

// Upgrade a game saved by an older version of this page: fill in any fields added since, so nothing reads an undefined.
function normalizeState() {
  S.players = (Array.isArray(S.players) ? S.players : []).map(p => {
    const q = Object.assign(newPlayer((p && p.name) || '?'), p || {});
    if (!Number.isFinite(q.life)) q.life = S.startLife || 40;
    if (!Array.isArray(q.lifeLog)) q.lifeLog = [];
    if (!Array.isArray(q.turnMs)) q.turnMs = [];
    if (!q.cmdDmg || typeof q.cmdDmg !== 'object') q.cmdDmg = {};
    if (!q.counters || typeof q.counters !== 'object') q.counters = {};
    return q;
  });
  if (!Number.isFinite(S.startLife)) S.startLife = 40;
  if (!Number.isFinite(S.podSize) || S.podSize < 2 || S.podSize > 6) S.podSize = 4;
  if (!Array.isArray(S.pending)) S.pending = [];
  if (!Array.isArray(S.undo)) S.undo = [];
  if (!Array.isArray(S.quotes)) S.quotes = [];
  if (!S.cfg) S.cfg = { url: '', token: '' };
  if ((S.screen === 'play' || S.screen === 'results') && !S.game) S.screen = 'setup';
  if ((S.screen === 'celebrate' || S.screen === 'overview') && !S.recap) S.screen = 'setup';
}

function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }

const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function historyFor(player) {
  const merged = {};
  for (const [c, n] of Object.entries(BUILTIN_HISTORY[player] || {})) merged[c] = n;
  for (const [c, n] of Object.entries(HIST[player] || {})) merged[c] = Math.max(merged[c] || 0, n);
  return Object.entries(merged).sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]));
}
function allKnownPlayers() {
  const set = new Set([...BASE_PLAYERS, ...Object.keys(BUILTIN_HISTORY), ...Object.keys(HIST)]);

}

// ---------------- game clock (pausable, timestamp based so the iPad sleeping doesn't break it) ----------------
function nowMs() { const g = S.game; if (!g) return 0; return (g.pausedAt != null ? g.pausedAt : Date.now()) - g.startedAt - g.pausedTotal; }
function fmtClock(ms) { const s = Math.max(0, Math.floor(ms / 1000)); const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), ss = s % 60;
  return (h ? h + ':' + String(m).padStart(2, '0') : String(m)) + ':' + String(ss).padStart(2, '0'); }

// ---------------- Scryfall ----------------
const SF = 'https://api.scryfall.com';
function lookupName(n) { return String(n || '').replace(/\s*\([^)]*\)\s*$/, '').trim(); }
function artOf(card) { return (card.image_uris && card.image_uris.art_crop) || (card.card_faces && card.card_faces[0] && card.card_faces[0].image_uris && card.card_faces[0].image_uris.art_crop) || null; }
async function sfJson(url) { const r = await fetch(url); if (!r.ok) throw new Error('scryfall ' + r.status); return r.json(); }
async function fetchDefaultArt(name) {
  const n = lookupName(name);
  for (const q of [n, n.split(/\s*\/\/\s*|\s+\+\s+/)[0]]) {
    try { const c = await sfJson(`${SF}/cards/named?exact=${encodeURIComponent(q)}`); const url = artOf(c); if (url) return { id: c.id, url }; } catch (e) {}
  }
  return null;
}
async function fetchPrintings(name) {
  const n = lookupName(name);
  for (const q of [n, n.split(/\s*\/\/\s*|\s+\+\s+/)[0]]) {
    try {
      let json = await sfJson(`${SF}/cards/search?q=${encodeURIComponent('!"' + q + '"')}&unique=prints&order=released&dir=desc`);
      let out = json.data || [];
      while (json.has_more && out.length < 400) { json = await sfJson(json.next_page); out = out.concat(json.data || []); }
      out = out.map(c => ({ id: c.id, url: artOf(c), set: c.set_name, code: (c.set || '').toUpperCase(), year: (c.released_at || '').slice(0, 4), artist: c.artist || '' })).filter(c => c.url);
      if (out.length) return out;
    } catch (e) {}
  }
  return [];
}
async function ensureArt(p) {
  if (!p.commander) return;
  if (!p.art && ART[p.commander]) p.art = ART[p.commander];
  if (!p.art) {
    const a = await fetchDefaultArt(p.commander);
    if (a) { p.art = a; ART[p.commander] = a; saveArt(); }
  }
  save(); render();
}

// ---------------- modal ----------------
function openModal(html, rot) {
  rot = rot || 0;
  const box = $('#modal-box'), side = rot === 90 || rot === 270;
  box.innerHTML = html; box.dataset.pwi = '';
  // a window opened from a seat is turned to face that seat; sideways seats swap the box's width and height limits
  box.style.transform = rot ? `rotate(${rot}deg)` : '';
  box.style.width = side ? 'min(88vh, 960px)' : ''; box.style.maxHeight = side ? '88vw' : '';
  $('#modal').classList.add('show');
}
function closeModal() { const box = $('#modal-box'); $('#modal').classList.remove('show'); box.innerHTML = ''; box.style.transform = box.style.width = box.style.maxHeight = ''; box.dataset.pwi = ''; }
$('#modal').addEventListener('click', e => { if (e.target.id === 'modal') closeModal(); });

function openArtPicker(i) {
  const p = S.players[i];
  openModal(`<div class="row" style="justify-content:space-between;"><h2 style="font-size:22px;">Pick art — ${esc(p.commander)}</h2><button id="m-close">Close</button></div>
    <div class="sub" style="margin-top:6px;">Every printing Scryfall has for this card. Your pick is remembered for this commander.</div>
    <div id="art-body" class="empty" style="margin-top:14px;">Loading printings…</div>`);
  $('#m-close').onclick = closeModal;
  fetchPrintings(p.commander).then(list => {
    const body = $('#art-body'); if (!body) return;
    if (!list.length) { body.textContent = 'No printings found (offline, or Scryfall does not know this name).'; return; }
    body.className = ''; body.innerHTML = `<div class="sub">${list.length} printing${list.length === 1 ? '' : 's'}</div><div class="artgrid">` + list.map((c, k) =>
      `<button class="artopt ${p.art && p.art.id === c.id ? 'sel' : ''}" data-k="${k}"><img src="${esc(c.url)}" loading="lazy" alt=""><div class="cap"><b>${esc(c.set)}</b> · ${esc(c.year)}<br>${esc(c.artist)}</div></button>`).join('') + '</div>';
    body.querySelectorAll('.artopt').forEach(b => b.onclick = () => {
      const c = list[+b.dataset.k]; p.art = { id: c.id, url: c.url }; ART[p.commander] = p.art; saveArt(); save(); closeModal(); render();
    });
  });
}

function openCommanderSearch(i) {
  const p = S.players[i];
  openModal(`<div class="row" style="justify-content:space-between;"><h2 style="font-size:22px;">Find a commander for ${esc(p.name)}</h2><button id="m-close">Close</button></div>
    <input id="cs-q" type="text" placeholder="Type a card name…" autocomplete="off" style="margin-top:14px;">
    <div id="cs-hits" style="margin-top:12px;"></div>`);
  $('#m-close').onclick = closeModal;
  const inp = $('#cs-q'); inp.focus();
  let t;
  inp.addEventListener('input', () => {
    clearTimeout(t);
    t = setTimeout(async () => {
      const q = inp.value.trim(); const box = $('#cs-hits'); if (!box) return;
      if (q.length < 2) { box.innerHTML = ''; return; }
      try {
        const j = await sfJson(`${SF}/cards/search?q=${encodeURIComponent(q + ' (is:commander or t:background)')}&unique=cards&order=edhrec`);
        const names = (j.data || []).slice(0, 12).map(c => c.name);
        box.innerHTML = names.length ? names.map(n => `<button class="hit" data-n="${esc(n)}">${esc(n)}</button>`).join('') : '<div class="sub">No matches.</div>';
        box.querySelectorAll('.hit').forEach(b => b.onclick = () => { setCommander(i, b.dataset.n); closeModal(); });
      } catch (e) { box.innerHTML = '<div class="sub">No matches (or offline). You can still use the name as typed:</div><button class="hit" id="cs-raw"></button>'; $('#cs-raw').textContent = q; $('#cs-raw').onclick = () => { setCommander(i, q); closeModal(); }; }
    }, 300);
  });
  inp.addEventListener('keydown', e => { if (e.key === 'Enter' && inp.value.trim()) { setCommander(i, inp.value.trim()); closeModal(); } });
}

function setCommander(i, name) {
  const p = S.players[i];
  p.commander = name || ''; p.art = null;

// the table shown the way it will be played: each seat holds its own name and commander drop-downs

function gamesTonight() { return S.sessionGames && S.sessionNight === S.night ? S.sessionGames : 0; }

function bindSetup() {
  $('#night').onchange = e => { S.night = e.target.value || todayStr(); save(); render(); };
  document.querySelectorAll('#fmt button').forEach(b => b.onclick = () => { S.format = b.dataset.f; save(); render(); });

    if (j === i) { render(); return; }
    if (j >= 0) { [S.players[i], S.players[j]] = [S.players[j], S.players[i]]; }   // already seated elsewhere: move/swap
    else S.players[i] = newPlayer(name);

  });
  document.querySelectorAll('[data-clear]').forEach(b => b.onclick = () => { S.players[+b.dataset.clear] = newPlayer(''); save(); render(); });
  document.querySelectorAll('[data-cmd]').forEach(sel => sel.onchange = () => {
    const i = +sel.dataset.cmd;

    setCommander(i, sel.value);
  });
  document.querySelectorAll('[data-art]').forEach(b => b.onclick = () => { const i = +b.dataset.art; if (S.players[i].commander) openArtPicker(i); });
  $('#shuffle').onclick = () => {
    const seats = S.players.filter(p => p.name), n = S.players.length, idx = [...Array(n).keys()];
    for (let i = idx.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [idx[i], idx[j]] = [idx[j], idx[i]]; }
    const old = S.players.slice(); S.players = idx.map(k => old[k]); save(); render();
  };

}
function newPlayer(name) { return { name, commander: '', art: null, elimRound: null, turnMs: [], ohsr: false, note: '', life: 40, lifeLog: [], delta: null, cmdDmg: {}, counters: {} }; }

// ---------------- play ----------------
function startGame() {
  if (S.players.some(p => !p.name)) { alert('Every seat needs a player before the game can start.'); return; }
  const missing = S.players.filter(p => !p.commander).map(p => p.name);
  if (missing.length && !confirm('No commander chosen for ' + missing.join(', ') + '. Start anyway? (They will be saved as unknown.)')) return;
  askFirst();
}
// seats never change during a night; each game, roll (or pick) who goes first and play continues clockwise from there
let rollTimer = null;
function askFirst() {
  let pick = null;
  const names = () => S.players.map((p, i) => `<button class="first-pick" data-fp="${i}" style="flex:1 1 150px;">${esc(p.name)}<div class="sub" style="font-size:12px;">seat ${i + 1}</div></button>`).join('');
  openModal(`<div class="row" style="justify-content:space-between;"><h2 style="font-size:24px;">Who goes first?</h2><button id="m-close">Cancel</button></div>
    <div class="row" style="margin:14px 0;"><button class="primary" id="roll" style="font-size:22px; padding:16px 26px;">🎲 Roll</button><div id="roll-out" class="sub" style="font-size:18px;">or tap a player</div></div>
    <div class="row" style="gap:8px;">${names()}</div>
    <div class="row" style="margin-top:18px;"><button class="primary" id="go" disabled style="font-size:20px; flex:1;">Start game</button></div>`);
  const mark = () => {
    document.querySelectorAll('.first-pick').forEach(b => { const on = +b.dataset.fp === pick; b.style.borderColor = on ? 'var(--accent)' : ''; b.style.background = on ? 'var(--accent-soft)' : ''; });
    $('#go').disabled = pick == null;
    $('#roll-out').textContent = pick == null ? 'or tap a player' : `${S.players[pick].name} goes first`;
  };
  document.querySelectorAll('.first-pick').forEach(b => b.onclick = () => { clearInterval(rollTimer); pick = +b.dataset.fp; mark(); });
  $('#roll').onclick = () => {
    clearInterval(rollTimer);
    const final = Math.floor(Math.random() * S.players.length); let n = 0;
    $('#roll').disabled = true;
    rollTimer = setInterval(() => {
      n++; pick = n >= 14 ? final : Math.floor(Math.random() * S.players.length); mark();
      if (n >= 14) { clearInterval(rollTimer); $('#roll').disabled = false; $('#roll').textContent = '🎲 Roll again'; }
    }, 110);
  };
  $('#m-close').onclick = () => { clearInterval(rollTimer); closeModal(); };
  $('#go').onclick = () => { clearInterval(rollTimer); closeModal(); beginGame(pick); };
}
function beginGame(first) {
  S.players.forEach(p => { p.elimRound = null; p.turnMs = []; p.ohsr = false; p.note = ''; p.life = S.startLife; p.minLife = S.startLife; p.maxPoison = 0; p.zeroTurns = 0; p.lifeLog = []; p.delta = null; p.cmdDmg = {}; p.counters = {}; });
  S.game = { startedAt: Date.now(), pausedAt: null, pausedTotal: 0, first, cur: first, round: 1, turnStart: 0, ended: false };
  S.undo = []; S.results = null; S.screen = 'play'; save(); render();
}
// position in the turn order (0 = went first) of a seat
function turnPos(i) { const n = S.players.length, f = (S.game && S.game.first) || 0; return (i - f + n) % n; }
function alive() { return S.players.map((p, i) => p.elimRound == null ? i : -1).filter(i => i >= 0); }
function snapshot() { S.undo.push(JSON.stringify({ g: S.game, p: S.players.map(p => ({ e: p.elimRound, t: p.turnMs, z: p.zeroTurns || 0 })) })); if (S.undo.length > 30) S.undo.shift(); }
function advance(fromIdx) {
  const al = alive(); if (al.length <= 1) return false;
  let n = fromIdx, wrapped = false;
  for (let k = 0; k < S.players.length; k++) { n = (n + 1) % S.players.length; if (turnPos(n) <= turnPos(fromIdx)) wrapped = true; if (S.players[n].elimRound == null) break; }
  if (wrapped) S.game.round++;
  S.game.cur = n; S.game.turnStart = nowMs();
  return true;
}
function passTurn() {
  const g = S.game; if (!g || g.pausedAt != null) return;
  snapshot();
  const cur = S.players[g.cur];
  cur.turnMs.push(nowMs() - g.turnStart);
  S.players.forEach(q => { if (q.life <= 0 && q.elimRound == null) q.zeroTurns = (q.zeroTurns || 0) + 1; });      // every turn that passes while someone sits at 0 life or below, not yet eliminated, counts for them
  if (!advance(g.cur)) { toResults(); return; }

}
function eliminate(i) {
  const g = S.game; const p = S.players[i];
  if (p.elimRound != null || !confirm(`Eliminate ${p.name}?`)) return;
  closeModal();
  snapshot();
  p.elimRound = g.round;
  if (i === g.cur) { p.turnMs.push(nowMs() - g.turnStart); advance(i); }
  const al = alive();
  save();
  if (al.length <= 1) { toResults(al[0]); return; }
  render();
}
function undo() {
  if (!S.undo.length) return;
  const s = JSON.parse(S.undo.pop()); Object.assign(S.game, { cur: s.g.cur, round: s.g.round, turnStart: s.g.turnStart });
  s.p.forEach((x, i) => { S.players[i].elimRound = x.e; S.players[i].turnMs = x.t; S.players[i].zeroTurns = x.z || 0; });
  save(); render();
}
function togglePause() {
  const g = S.game; if (!g) return;
  if (g.pausedAt == null) g.pausedAt = Date.now(); else { g.pausedTotal += Date.now() - g.pausedAt; g.pausedAt = null; }
  save(); render();
}

// ----- life totals -----
// Taps made within BURST_MS of each other count as one change (three taps of "−" = "−3"). The floating number
// stays on the panel until that player's life changes again, then it starts over with the new change.
const BURST_MS = 2500;
function fmtDelta(v) { return (v > 0 ? '+' : '−') + Math.abs(v); }
function changeLife(i, d) {
  const g = S.game, p = S.players[i];
  if (!g || !p || p.elimRound != null || !d) return;
  const now = Date.now();
  p.life += d; p.minLife = Math.min(p.minLife == null ? S.startLife : p.minLife, p.life);
  if (p.delta && now - p.delta.ts < BURST_MS && p.lifeLog.length) {
    p.delta.value += d; p.delta.ts = now;
    const e = p.lifeLog[p.lifeLog.length - 1]; e.delta = p.delta.value; e.total = p.life;
  } else {
    p.delta = { value: d, ts: now };
    p.lifeLog.push({ ms: nowMs(), round: g.round, by: S.players[g.cur].name, delta: d, total: p.life });
  }
  save(); updateSeat(i, true);
}
function setLife(i, total) { const p = S.players[i]; changeLife(i, total - p.life); }
function updateSeat(i, pop) {
  const p = S.players[i];
  const L = document.querySelector(`[data-l="${i}"]`), D = document.querySelector(`[data-d="${i}"]`), O = document.querySelector(`[data-out="${i}"]`), C = document.querySelector(`[data-c="${i}"]`);
  if (L) { L.textContent = p.life; L.className = 'life' + (p.life <= 0 ? ' dead' : p.life <= 10 ? ' low' : ''); }
  if (D) {
    const v = p.delta ? p.delta.value : 0;
    D.textContent = v ? fmtDelta(v) : ''; D.className = 'delta ' + (v > 0 ? 'pos' : v < 0 ? 'neg' : '');
    if (pop && v) { D.classList.remove('pop'); void D.offsetWidth; D.classList.add('pop'); }
  }
  if (C) { const h = chipsHtml(p); C.innerHTML = h; C.hidden = !h; C.classList.toggle('two', C.children.length > 3); }   // the counters panel exists only while a counter is above 0
  if (O) O.hidden = !shouldBeOut(p);
}
// ----- player window: life, commander damage, counters -----
const COUNTERS = [
  { k: 'Poison', col: '#9bd36a', lethal: 10 },
  { k: 'Energy', col: '#ffd45e' },
  { k: 'Experience', col: '#c79bff' },
  { k: 'Rad', col: '#e0e86a' },
  { k: 'Ticket', col: '#ff9ec2' },
  { k: 'Acorn', col: '#d9a066' },
];
const CMD_LETHAL = 21;
function counterDef(k) { return COUNTERS.find(c => c.k === k) || { k, col: '#cdbfae' }; }
function counterKeys(p) { const keys = COUNTERS.map(c => c.k); Object.keys(p.counters || {}).forEach(k => { if (!keys.includes(k)) keys.push(k); }); return keys; }
function chipsHtml(p) {
  return counterKeys(p).filter(k => ((p.counters || {})[k] || 0) > 0).map(k => {
    const d = counterDef(k), lethal = d.lethal && p.counters[k] >= d.lethal;
    return `<span class="cchip ${lethal ? 'lethal' : ''}" style="--c:${d.col}">${esc(k)} <b>${p.counters[k]}</b></span>`;
  }).join('');
}
function shouldBeOut(p) {
  if (p.elimRound != null) return false;
  if (p.life <= 0) return true;
  if (Object.values(p.cmdDmg || {}).some(v => v >= CMD_LETHAL)) return true;
  return counterKeys(p).some(k => { const d = counterDef(k); return d.lethal && ((p.counters || {})[k] || 0) >= d.lethal; });
}
function bumpCmd(i, src, d) {
  const p = S.players[i], cur = p.cmdDmg[src] || 0, v = Math.max(0, cur + d);
  if (v === cur) return;
  p.cmdDmg[src] = v;
  if (S.cmdLife) changeLife(i, -(v - cur));   // commander damage is also damage: optionally take it off life too
  save(); updateSeat(i); refreshWindow(i);
}
function bumpCounter(i, k, d) {
  const p = S.players[i], cur = p.counters[k] || 0, v = Math.max(0, cur + d);
  if (v === cur) return;
  p.counters[k] = v; if (k === 'Poison') p.maxPoison = Math.max(p.maxPoison || 0, v); save(); updateSeat(i); refreshWindow(i);
}
function refreshWindow(i) {

  $('#cmd-life').onchange = e => { S.cmdLife = e.target.checked; save(); };
  box.querySelectorAll('[data-cd]').forEach(b => b.onclick = () => bumpCmd(i, b.dataset.cd, +b.dataset.d));
  box.querySelectorAll('[data-cn]').forEach(b => b.onclick = () => bumpCounter(i, b.dataset.cn, +b.dataset.d));

    currentGame = { date: dateVal, format: 'FFA', totalTurns: null, gameLengthMin: null, players: [] };
    games.push(currentGame);
  }

  for (const r of objRows) {
    const dateCell = (r['Date'] || '').toString().trim();
    const gameCell = (r['Game'] || '').toString().trim();
    const playerCell = (r['Player'] || '').toString().trim();
    const commanderCell = (r['Commander'] || '').toString().trim();
    const winCell = (r['Win'] || '').toString().trim();
    const noteCell = (r['Notes'] || '').toString().trim();
    const turnOrderCell = (r['Turn Order'] || '').toString().trim();
    const elimTurnCell = (r['Eliminated Turn'] || '').toString().trim();
    const totalTurnsCell = (r['Total Turns'] || '').toString().trim();
    const gameLengthCell = (r['Game Length (min)'] || '').toString().trim();
    const startCell = (r['Start (epoch s)'] || '').toString().trim();
    const endCell = (r['End (epoch s)'] || '').toString().trim();
    const avgTurnCell = (r['Avg Turn (s)'] || r['Avg Turn'] || '').toString().trim();

    let gameLabelChanged = false;
    if (dateCell) {
      if (isStrictDate(dateCell)) {
        curDate = tryExtractDate(dateCell, curDate);
      } else {
        const extracted = tryExtractDate(dateCell, curDate);
        if (extracted) curDate = extracted;
        if (hasQuoteText(dateCell)) quotes.push({ date: curDate, text: dateCell });
      }
    }
    if (gameCell) {
      const label = gameCell.toLowerCase().replace(/:$/, '').trim();
      if (label !== curGameLabel) gameLabelChanged = true;
      curGameLabel = label;
    }

    if (playerCell) {
      const shouldStartNew = !currentGame || gameLabelChanged ||
        currentGame.players.some(p => p.name === playerCell);
      if (shouldStartNew) startNewGame(curDate);

      let commander = commanderCell || null;
      if (commander === '~Unknown') commander = null;
      // Two pilots can run the same commander as separate decks. Each pilot's copy is tracked on its own,
      // shown as "Commander (Pilot)". Old rows that used a one-letter prefix ("R Estrid...") fold into the same scheme.
      if (commander) {
        const baseName = commander.replace(/^[A-Z]\s+(?=\S)/, '');
        if (SPLIT_BY_PILOT.has(baseName)) commander = `${baseName} (${playerCell})`;
      }

      const winLower = winCell.toLowerCase();
      let result = null;
      if (winLower === 'yes') result = 'win';
      else if (winLower === 'draw') result = 'draw';

      const ohsr = /ohsr/i.test(noteCell);
      const is2hg = /2hg/i.test(noteCell);
      let team = null;
      const tm = noteCell.match(/team\s*([12])/i);
      if (tm) team = parseInt(tm[1], 10);
      let leftoverNote = noteCell.replace(/ohsr|2hg|;/gi, '').replace(/team\s*[12]/gi, '').trim().replace(/^[,;\s]+|[,;\s]+$/g, '');

      if (is2hg) currentGame.format = '2HG';

      currentGame.players.push({
        name: playerCell, commander, result, ohsr, team,
        note: leftoverNote || null,
        turnOrder: turnOrderCell ? parseInt(turnOrderCell, 10) : null,
        eliminatedTurn: elimTurnCell ? parseInt(elimTurnCell, 10) : null,
        avgTurnSec: (parseFloat(avgTurnCell) > 0) ? parseFloat(avgTurnCell) : null,
      });

      if (totalTurnsCell) currentGame.totalTurns = parseInt(totalTurnsCell, 10);
      if (gameLengthCell) currentGame.gameLengthMin = parseFloat(gameLengthCell);
      if (parseFloat(startCell) > 0) currentGame.startEpoch = parseFloat(startCell);
      if (parseFloat(endCell) > 0) currentGame.endEpoch = parseFloat(endCell);
    }
  }

  for (const g of games) {
    const hasDeclared = g.players.some(p => p.result === 'win' || p.result === 'draw');
    if (hasDeclared) for (const p of g.players) if (p.result === null) p.result = 'loss';
  }
  games.forEach((g, i) => { g.id = i + 1; g.podSize = g.players.length; });

  return { games, quotes: dedupeQuotes(quotes) };
}

function dedupeQuotes(quotes) {
  const seen = new Set();
  const out = [];
  for (const q of quotes) {
    if (seen.has(q.text)) continue;
    seen.add(q.text);
    out.push(q);
  }
  return out;
}

// ---------------- recap stats engine ----------------
// The data cleaning above is copied from the website, so a game is read exactly the way the site reads it.
// After a game reaches the sheet, the whole sheet is fetched and every "before" and "after" figure is worked out here.
const _won = p => p.result === 'win', _hasWinner = g => g.players.some(p => p.result === 'win' || p.result === 'draw');
const _counted = g => g.format === 'FFA' && _hasWinner(g);     // the games the website's win rates are made from
function ordinalN(n) { const s = ['th', 'st', 'nd', 'rd'], v = n % 100; return n + (s[(v - 20) % 10] || s[v] || s[0]); }
function _tally(games, keyOf) {

    const k = keyOf(p); if (!k) continue;
    const s = m[k] = m[k] || { key: k, games: 0, wins: 0, draws: 0 };
    s.games++; if (p.result === 'win') s.wins++; if (p.result === 'draw') s.draws++;

}
function _ranks(m, minGames) {

  const r = {}; list.forEach((s, i) => { r[s.key] = i + 1; }); return r;
}

    date: new Date(y, m - 1, d), format: pl.format, totalTurns: pl.totalTurns, gameLengthMin: pl.lengthMin,
    players: pl.players.map(p => ({
      name: p.name, commander: p.commander, result: p.result === 'yes' ? 'win' : p.result === 'DRAW' ? 'draw' : null, ohsr: !!p.ohsr,
      turnOrder: p.turnOrder, eliminatedTurn: p.elimTurn, avgTurnSec: p.avgTurnSec > 0 ? p.avgTurnSec : null,
    })),

}
function _sameGame(g, pl) {
  const [y, m, d] = String(pl.date).split('-').map(Number);
  if (!g.date || g.date.getFullYear() !== y || g.date.getMonth() !== m - 1 || g.date.getDate() !== d) return false;
  const a = g.players.map(p => p.name).sort().join('|'), b = pl.players.map(p => p.name).sort().join('|');
  return a === b && g.totalTurns === pl.totalTurns;
}
// the sheet already holds the new game (normal case) or it does not yet (then it is added here so the numbers still work)
function splitBeforeAfter(all, pl) {
  for (let i = all.length - 1; i >= Math.max(0, all.length - 4); i--) {
    if (_sameGame(all[i], pl)) return { before: all.slice(0, i), after: all.slice(0, i + 1), G: all[i] };
  }
  const G = gameFromPayload(pl);
  if (G.players.some(p => p.result === 'win' || p.result === 'draw')) G.players.forEach(p => { if (p.result === null) p.result = 'loss'; });

const _runEnd = (arr, f) => { let n = 0; for (let i = arr.length - 1; i >= 0 && f(arr[i]); i--) n++; return n; };

function computeRecapStats(all, pl) {
  const { before, after, G } = splitBeforeAfter(all, pl);
  const counted = _counted(G);
  const out = { counted, format: G.format, players: [], commanders: [], leaderboard: [], deckMilestones: [], streaks: [], usualPace: {} };
  const names = G.players.map(p => p.name);

  // ---- player win rates (before -> after) ----
  const bP = _tally(before, p => p.name), aP = _tally(after, p => p.name);
  const bPR = _ranks(bP, 1), aPR = _ranks(aP, 1);
  if (counted) for (const p of G.players) {
    const b = bP[p.name], a = aP[p.name]; if (!a) continue;
    out.players.push({ name: p.name, result: p.result, beforeGames: b ? b.games : 0, beforeWins: b ? b.wins : 0, beforeRate: b ? b.rate : null,
      afterGames: a.games, afterWins: a.wins, afterRate: a.rate, beforeRank: bPR[p.name] || null, afterRank: aPR[p.name] || null });
  }

  // ---- commander win rates (before -> after) ----

    const b = bC[p.commander], a = aC[p.commander]; if (!a) continue;
    out.commanders.push({ commander: p.commander, pilot: p.name, result: p.result, beforeGames: b ? b.games : 0, beforeWins: b ? b.wins : 0, beforeRate: b ? b.rate : null,
      afterGames: a.games, afterWins: a.wins, afterRate: a.rate });
  }

  // ---- deck milestones ----
  const bPC = _tally(before, p => p.commander && p.name + '‖' + p.commander), aPC = _tally(after, p => p.commander && p.name + '‖' + p.commander);
  const bCR = _ranks(bC, 5), aCR = _ranks(aC, 5);
  const ms = out.deckMilestones, WINS = [1, 5, 10, 15, 20, 25, 30, 40, 50, 75, 100];
  for (const p of G.players) {
    const c = p.commander; if (!c || c === '~Unknown') continue;
    const ever = before.some(g => g.players.some(x => x.commander === c));
    if (!ever) ms.push({ icon: '✨', text: `${c} makes its debut, piloted by ${p.name}`, kind: 'debut' });
    if (!counted) continue;
    const b = bC[c], a = aC[c]; if (!a) continue;
    const bg = b ? b.games : 0, bw = b ? b.wins : 0;
    if (Math.floor(a.games / 5) > Math.floor(bg / 5)) ms.push({ icon: '🎯', text: `${c} played its ${ordinalN(Math.floor(a.games / 5) * 5)} game`, kind: 'games' });
    WINS.forEach(w => { if (bw < w && a.wins >= w) ms.push({ icon: w === 1 ? '🥇' : '🏅', text: w === 1 ? `${c} earned its first win` : `${c} reached ${w} wins`, kind: 'wins' }); });
    if (a.games >= 5 && bg >= 5 && b.rate < 0.5 && a.rate >= 0.5) ms.push({ icon: '📈', text: `${c} climbed back to a 50%+ win rate`, kind: 'rate' });
    if (a.games >= 5 && bg >= 5 && b.rate >= 0.5 && a.rate < 0.5) ms.push({ icon: '📉', text: `${c} slipped below a 50% win rate`, kind: 'rate' });
    const k = p.name + '‖' + c, pb = bPC[k], pa = aPC[k]; if (!pa) continue;
    const pg = pb ? pb.games : 0, pw = pb ? pb.wins : 0;
    if (ever && pg === 0) ms.push({ icon: '🆕', text: `${p.name}'s first game with ${c}`, kind: 'pair' });
    if (pw === 0 && pa.wins >= 1 && p.result === 'win' && pa.games > 1) ms.push({ icon: '🥇', text: `${p.name}'s first win with ${c}`, kind: 'pair' });

        if (p.commander) (cseq[p.commander] = cseq[p.commander] || []).push({ res: p.result });
      }

    }

    for (const n of names) {
      const arr = seq[n] || []; if (!arr.length) continue;
      const win = e => e.res === 'win', loss = e => e.res === 'loss', sol = e => e.ohsr;

      else if (_runEnd(prev, win) >= 2) st.push({ icon: '🧊', text: `${n}'s ${_runEnd(prev, win)}-game win streak ended`, tag: '', kind: 'snap' });
      const sc = _runEnd(arr, sol); if (sc >= 2) st.push({ icon: '💍', text: `${n} has opened with Sol Ring ${sc} games in a row`, tag: rec(sc, _bestRun(prev, sol)), kind: 'ohsr' });

      const last = arr[arr.length - 1].cmd, dc = _runEnd(arr, e => e.cmd === last);

      const c = p.commander; if (!c || c === '~Unknown') continue; const arr = cseq[c] || [];

}

    round: Math.random() < .22, ph: Math.random() * 6.28, t: 0, life });
  const W = () => cv.width / dpr, H = () => cv.height / dpr;
  const explode = (n) => { for (let i = 0; i < n; i++) { const a = Math.random() * 6.283, s = (7 + Math.random() * 17) * (Math.random() < .3 ? .55 : 1); add(W() / 2, H() * .42, Math.cos(a) * s, Math.sin(a) * s - 4, 170 + Math.random() * 110); } };
  const cannon = (side, n) => { for (let i = 0; i < n; i++) { const a = (side < 0 ? -1.05 : -2.09) + (Math.random() - .5) * .55, s = 15 + Math.random() * 13; add(side < 0 ? 0 : W(), H() * .96, Math.cos(a) * s, Math.sin(a) * s, 190 + Math.random() * 100); } };
  const rain = (n) => { for (let i = 0; i < n; i++) add(Math.random() * W(), -20 - Math.random() * 120, (Math.random() - .5) * 2, 2 + Math.random() * 3, 240 + Math.random() * 100); };
  const k = calm ? .25 : 1;
  explode(Math.round(320 * k));
  const timers = [setTimeout(() => explode(Math.round(180 * k)), 650), setTimeout(() => { cannon(-1, Math.round(110 * k)); cannon(1, Math.round(110 * k)); }, 450),
    setTimeout(() => rain(Math.round(90 * k)), 1500), setTimeout(() => rain(Math.round(70 * k)), 2600), setTimeout(() => { explode(Math.round(120 * k)); }, 3600)];
  const tick = () => {
    frame++; ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, W(), H());
    for (let i = P.length - 1; i >= 0; i--) {
      const p = P[i]; p.t++;
      p.vx *= .985; p.vy = p.vy * .985 + .3; p.x += p.vx + Math.sin(p.t * .09 + p.ph) * .7; p.y += p.vy; p.r += p.vr;
      if (p.t > p.life || p.y > H() + 40) { P.splice(i, 1); continue; }
      const fade = p.t > p.life - 35 ? Math.max(0, (p.life - p.t) / 35) : 1;
      ctx.save(); ctx.globalAlpha = fade; ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c;
      if (p.round) { ctx.beginPath(); ctx.arc(0, 0, p.w * .45, 0, 6.283); ctx.fill(); }
      else { ctx.scale(1, Math.cos(p.t * .12 + p.ph)); ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); }
      ctx.restore();
    }
    if (P.length || frame < 260) confettiRaf = requestAnimationFrame(tick); else { stopConfetti(); timers.forEach(clearTimeout); }
  };
  confettiRaf = requestAnimationFrame(tick);
}

// ---- what happened in this game (worked out from the local game, before it is cleared) ----
function buildRecapLocal(pl) {
  const g = S.game, R = S.results;
  const players = S.players.map((p, i) => {
    const entries = p.lifeLog || [];
    let lost = 0, gained = 0, hit = null, heal = null, selfLost = 0;
    const perTurn = {};      // life change per turn (round + whose turn it was), so a hit or heal means a whole turn's worth
    entries.forEach(e => {
      const k = e.round + '|' + e.by, t = perTurn[k] = perTurn[k] || { lost: 0, gain: 0, by: e.by, round: e.round };
      if (e.delta < 0) t.lost += e.delta; else t.gain += e.delta;
      if (e.delta < 0 && e.by === p.name) selfLost += -e.delta;
      if (e.delta < 0) lost += -e.delta;
      if (e.delta > 0) gained += e.delta;
    });
    Object.values(perTurn).forEach(t => { if (t.lost < 0 && (!hit || t.lost < hit.delta)) hit = { delta: t.lost, by: t.by, round: t.round }; if (t.gain > 0 && (!heal || t.gain > heal.delta)) heal = { delta: t.gain, by: t.by, round: t.round }; });
    const turns = (p.turnMs || []).length, tot = (p.turnMs || []).reduce((a, b) => a + b, 0);
    const pp = pl.players[i];
    return {
      name: p.name, commander: p.commander || '', art: p.art ? p.art.url : null, result: pp.result,
      avgSec: turns ? Math.round(tot / turns / 1000) : null, turns, longestSec: turns ? Math.round(Math.max(...p.turnMs) / 1000) : null, shortestSec: turns ? Math.round(Math.min(...p.turnMs) / 1000) : null,
      lost, gained, selfLost, hit: hit ? { d: hit.delta, by: hit.by, round: hit.round } : null, heal: heal ? { d: heal.delta, by: heal.by, round: heal.round } : null, end: p.life, zeroTurns: p.zeroTurns || 0, cmdTaken: Object.values(p.cmdDmg || {}).reduce((a, b) => a + b, 0), survived: p.elimRound == null && p.life > 0 && ((p.counters || {}).Poison || 0) < 10, low: Math.min(p.minLife == null ? S.startLife : p.minLife, p.life, S.startLife), poison: Math.max(p.maxPoison || 0, (p.counters || {}).Poison || 0), changes: entries.length,
    };
  });
  // most damage dealt in a single turn: life other players lost during someone's turn, credited to the player whose turn it was
  const dealt = {};
  S.players.forEach(v => (v.lifeLog || []).forEach(e => { if (e.delta < 0 && e.by && e.by !== v.name) { const k = e.round + '|' + e.by, t = dealt[k] = dealt[k] || { d: 0, by: e.by, round: e.round }; t.d += e.delta; } }));
  let hay = null; Object.values(dealt).forEach(t => { if (!hay || t.d < hay.d) hay = t; });
  const winners = players.filter(p => p.result === 'yes'), draws = players.filter(p => p.result === 'DRAW');
  return { id: pl.id, night: S.night, gameNo: S.sessionGames, format: S.format, lengthMin: pl.lengthMin, totalTurns: pl.totalTurns, startLife: S.startLife,
    nightMin: Math.max(pl.lengthMin, Math.round((pl.endEpoch - S.sessionStart) / 60)), winners, hay, isDraw: R.mode === 'draw', drawers: draws, players, payload: pl, stats: null, statsErr: null };
}

// every badge this game earned; worked out from the local game, so it can be saved to the sheet the moment the game ends
function computeBadges(r) {
  const P = r.players;
  const timed = P.filter(p => p.avgSec != null).sort((a, b) => a.avgSec - b.avgSec);
  const moved = P.map(p => ({ p, moved: p.lost + p.gained })).sort((a, b) => b.moved - a.moved);
  const hits = P.filter(p => p.hit).sort((a, b) => a.hit.d - b.hit.d), heals = P.filter(p => p.heal).sort((a, b) => b.heal.d - a.heal.d);
  const badges = [];
  const B = (icon, name, who, what) => badges.push({ icon, name, who, what });
  if (hits[0]) B('🥊', 'Punching Bag', hits[0].name, `took ${-hits[0].hit.d} damage in a single turn (turn ${hits[0].hit.round}, during ${hits[0].hit.by}'s turn)`);
  if (r.hay) B('💪', 'Haymaker', r.hay.by, `dealt ${-r.hay.d} damage in a single turn (turn ${r.hay.round})`);
  if (heals[0] && heals[0].heal.d >= 5) B('💚', 'Second Wind', heals[0].name, `gained +${heals[0].heal.d} in a single turn (turn ${heals[0].heal.round}, during ${heals[0].heal.by}'s turn)`);
  if (moved[0].moved) B('🎢', 'Rollercoaster', moved[0].p.name, `−${moved[0].p.lost} lost and +${moved[0].p.gained} gained, the most life movement`);
  P.filter(p => p.gained >= 20).forEach(p => B('🕊️', 'Soul Sister', p.name, `gained ${p.gained} life over the game`));
  P.filter(p => p.selfLost >= 13).forEach(p => B('🩸', 'Blood Mage', p.name, `paid ${p.selfLost} life on their own turns`));
  if (P.some(p => p.lost > 0 || p.cmdTaken > 0)) P.filter(p => p.result === 'yes' && p.lost === 0 && !p.cmdTaken).forEach(p => B('🛡️', 'Untouchable', p.name, 'won the game without ever taking damage, commander damage included'));
  P.filter(p => p.result === 'yes' && p.end <= 0).forEach(p => B('💀', 'The Master Of Death', p.name, `won the game at ${p.end} life`));
  P.filter(p => p.zeroTurns > 0).forEach(p => B('🧟', 'Not Dead After All', p.name, `spent ${p.zeroTurns} turn${p.zeroTurns === 1 ? '' : 's'} at 0 life or below`));
  P.filter(p => p.result === 'yes' && p.end === 1).forEach(p => B('🪒', 'The Brink', p.name, 'won the game at 1 life'));
  P.filter(p => p.survived && p.low <= 5 && !(p.result === 'yes' && p.end === 1)).forEach(p => B('🔔', "I Didn't Hear No Bell", p.name, `survived after dropping to ${p.low} life`));
  P.filter(p => p.survived && p.poison >= 8).forEach(p => B('🐍', 'Snake Handler', p.name, `survived with ${p.poison} poison counters`));
  r.payload.players.filter(x => x.result === 'yes' && x.ohsr).forEach(x => B('💍', 'Ban Sol Ring', x.name, 'won the game after opening with a Sol Ring'));
  { const pp = r.payload.players, n = pp.length;
    pp.filter(x => x.result === 'yes' && n > 1 && Number(x.turnOrder) === n).forEach(x => B('🐢', "If You're Not First, You're Last", x.name, `won the game from the last seat in the turn order (${n} of ${n})`)); }
  if (timed.length > 1) {
    const fast = timed[0], slow = timed[timed.length - 1];
    B('⚡', 'Speed Magic', fast.name, `fastest average turn at ${sec2clock(fast.avgSec)}`);
    B('🦉', 'Deep Thinker', slow.name, `slowest average turn at ${sec2clock(slow.avgSec)}`);
    if (slow.result === 'yes') B('🎯', 'Found the Line', slow.name, `won the game with the slowest average turn (${sec2clock(slow.avgSec)})`);
    if (fast.result === 'yes') B('🏁', "Git'r Done", fast.name, `won the game with the fastest average turn (${sec2clock(fast.avgSec)})`);
    const Lg = timed.slice().sort((a, b) => b.longestSec - a.longestSec)[0], Sh = timed.slice().sort((a, b) => a.shortestSec - b.shortestSec)[0];
    B('🎭', 'Intermission', Lg.name, `longest single turn at ${sec2clock(Lg.longestSec)}`);
    B('⏱️', "Blink and You'll Miss It", Sh.name, `shortest single turn at ${sec2clock(Sh.shortestSec)}`);
  }
  return badges;
}

// ---- overview helpers ----
const fmtNight = m => m >= 60 ? `${Math.floor(m / 60)}h ${String(m % 60).padStart(2, '0')}m` : `${m} min`;
const sec2clock = s => s == null ? '—' : Math.floor(s / 60) + ':' + String(Math.round(s % 60)).padStart(2, '0');
const pct1 = x => x == null ? '—' : (Math.round(x * 1000) / 10).toString().replace(/\.0$/, '') + '%';
function dpill(delta) {
  const d = Math.round(delta * 1000) / 10;

  return `<span class="pill ${d > 0 ? 'up' : 'down'}">${d > 0 ? '▲ +' : '▼ −'}${Math.abs(d).toString().replace(/\.0$/, '')}</span>`;
}
function rankPill(b, a) {
  if (!a) return ''; if (!b) return `<span class="pill tag">#${a} · new</span>`;
  if (b === a) return `<span class="pill flat">#${a}</span>`;

// ---- after the game is in the sheet: read the whole sheet and work out the before/after numbers ----
let loadingRecap = false;
async function loadRecapStats() {
  const r = S.recap;
  if (!r || r.stats || loadingRecap || !S.cfg.url) return;
  if (S.pending.some(x => x.payload.id === r.id)) return;      // wait until this game is really in the sheet
  loadingRecap = true;
  try {
    const resp = await fetch(S.cfg.url + (S.cfg.url.includes('?') ? '&' : '?') + 'action=rows&token=' + encodeURIComponent(S.cfg.token));
    const j = await resp.json();
    if (!j.ok) throw new Error(j.error || 'rejected');
    r.stats = computeRecapStats(cleanData(rowsArrayToObjects(j.rows)).games, r.payload); r.statsErr = null;
  } catch (e) { r.statsErr = String((e && e.message) || e).slice(0, 80); }
  loadingRecap = false;
  save();
  if (S.recap === r && S.screen === 'overview') render();
}
/*__RECAP_END__*/

// ---------------- sync ----------------
let syncing = false, syncState = { cls: '', text: '' };
function renderSync() {
  const n = S.pending.length;
  let cls = 'dot', text = '';
  if (!S.cfg.url) { cls += ' bad'; text = 'sheet not connected'; }
  else if (syncing) { cls += ' wait'; text = 'sending…'; }
  else if (n) { cls += ' wait'; text = n + ' waiting' + (syncState.text ? ' · ' + syncState.text : ''); }
  else { cls += ' ok'; text = 'synced'; }
  $('#sync').innerHTML = `<span class="${cls}"></span>${esc(text)}`;
  renderCeleSync();
}
async function trySync() {
  if (syncing || !S.cfg.url || !S.pending.length) { renderSync(); return; }
  syncing = true; syncState.text = ''; renderSync();
  try {
    while (S.pending.length) {
      const body = JSON.stringify(Object.assign({}, S.pending[0].payload, { token: S.cfg.token }));
      const r = await fetch(S.cfg.url, { method: 'POST', body });   // no custom headers => no CORS preflight
      const j = await r.json();
      if (!j.ok) throw new Error(j.error || 'rejected');
      S.pending.shift(); save();
      if (S.screen === 'done' || S.screen === 'overview') render();
    }
  } catch (e) { syncState.text = String(e.message || e).slice(0, 60); }
  syncing = false; renderSync();
  loadRecapStats();
}
async function refreshHistory() {
  if (!S.cfg.url) return;
  try {
    const r = await fetch(S.cfg.url + (S.cfg.url.includes('?') ? '&' : '?') + 'action=history&token=' + encodeURIComponent(S.cfg.token));
    const j = await r.json();
    if (j.ok && j.history) { HIST = j.history; try { localStorage.setItem(HIST_KEY, JSON.stringify(HIST)); } catch (e) {} /* no redraw: it would yank open dropdowns; applies on the next render */ }
  } catch (e) {}
}
window.addEventListener('online', trySync);
setInterval(trySync, 30000);

// ---------------- settings ----------------
$('#btn-settings').onclick = () => {
  openModal(`<div class="row" style="justify-content:space-between;"><h2 style="font-size:22px;">Sheet connection</h2><button id="m-close">Close</button></div>
    <div class="sub" style="margin:8px 0 14px;">Paste the Web app URL from your Google Apps Script deployment, and the same secret token you put in the script.</div>
    <div class="sub">Web app URL</div><input id="s-url" type="text" value="${esc(S.cfg.url)}" placeholder="https://script.google.com/macros/s/…/exec">
    <div class="sub" style="margin-top:12px;">Secret token</div><input id="s-tok" type="text" value="${esc(S.cfg.token)}" placeholder="the token from the script">
    <label class="row" style="margin-top:14px; gap:10px;"><input type="checkbox" id="s-sound" ${S.cfg.sound !== false ? 'checked' : ''} style="width:22px;height:22px;"> <span>Spoken reminder when a turn passes 5 minutes (and every 5 after)</span></label>
    <div class="row" style="margin-top:8px;"><button id="s-test">Test the alert (chime + voice)</button></div>
    <div class="row" style="margin-top:16px;"><button class="primary" id="s-save">Save &amp; test</button><div id="s-msg" class="sub"></div></div>
    <hr style="border:0; border-top:1px solid var(--line); margin:20px 0;">
    <div class="sub" style="margin-bottom:10px;">Tracker build ${BUILD}</div>
    <div class="row"><button class="danger" id="s-reset">Discard unsent games &amp; reset app state</button></div>`);
  $('#m-close').onclick = closeModal;
  $('#s-sound').onchange = () => { S.cfg.sound = $('#s-sound').checked; save(); };
  $('#s-test').onclick = () => { unlockAudio(); fireAlert('Randy', 1); };
  $('#s-save').onclick = async () => {
    S.cfg.url = $('#s-url').value.trim(); S.cfg.token = $('#s-tok').value.trim(); save();
    const msg = $('#s-msg'); msg.textContent = 'Testing…';
    try {
      const r = await fetch(S.cfg.url + (S.cfg.url.includes('?') ? '&' : '?') + 'action=ping&token=' + encodeURIComponent(S.cfg.token));
      const j = await r.json(); msg.textContent = j.ok ? '✓ Connected' : ('✗ ' + (j.error || 'rejected'));
      if (j.ok) { refreshHistory(); trySync(); }
    } catch (e) { msg.textContent = '✗ Could not reach the script'; }
    renderSync();
  };
  $('#s-reset').onclick = () => { if (confirm(S.pending.length + ' unsent game(s) will be lost. Reset?')) { const cfg = S.cfg; S = fresh(); S.cfg = cfg; save(); closeModal(); render(); } };
};

// ---------------- router ----------------
const BUILD = '2026-11-26 · v50';
function render() {
  try {
    const app = $('#app');
    const sc = S.screen;
    document.body.classList.toggle('playing', sc === 'play' && !!S.game);
    if (sc !== 'celebrate') { stopConfetti(); document.body.classList.remove('celebrating'); }
    const rc = !!S.recap;
    app.innerHTML = sc === 'play' && S.game ? renderPlay() : sc === 'results' && S.game ? renderResults() : sc === 'celebrate' && rc ? renderCelebrate() : sc === 'overview' && rc ? renderRecap() : sc === 'done' ? renderDone() : renderSetup();
    if (sc === 'play' && S.game) bindPlay(); else if (sc === 'results' && S.game) bindResults(); else if (sc === 'celebrate' && rc) bindCelebrate(); else if (sc === 'overview' && rc) bindRecap(); else if (sc === 'done') bindDone(); else bindSetup();
    renderSync();
    let bt=document.getElementById('buildtag'); if(!bt){bt=document.createElement('div'); bt.id='buildtag'; document.body.appendChild(bt);} bt.textContent='build '+BUILD;
  } catch (e) {
    // never leave a dead screen: offer a way out, and keep any games that have not reached the sheet yet
    document.body.classList.remove('playing');
    $('#app').innerHTML = `<div class="card"><h2 style="font-size:22px;">Something went wrong loading the saved game</h2>
      <p class="sub">${esc(String(e && e.message || e))} · build ${BUILD}</p>
      <div class="row"><button class="primary" id="fix-reset">Reset the tracker (keeps the sheet connection and any unsent games)</button></div></div>`;
    $('#fix-reset').onclick = () => { const keep = { cfg: S.cfg, pending: S.pending }; S = Object.assign(fresh(), keep); S.screen = 'setup'; save(); render(); };
  }
}
render();
S.players.forEach(p => { if (p.commander && !p.art) ensureArt(p); });
refreshHistory(); trySync();
if (!S.cfg.url) setTimeout(() => $('#btn-settings').click(), 400);
</script>
</body>
