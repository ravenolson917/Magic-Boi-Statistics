<title>Friday Night Commander — Game Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#1c1510; --card:#2a2018; --ink:#f0e6d8; --ink-soft:#b3a08c; --line:#4a3a2c;
    --accent:#c9a06a; --accent-soft:#4a3a26; --good:#8faf6e; --good-soft:#2e3524; --bad:#c46a4e; --bad-soft:#3c2620;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; background:var(--bg); color:var(--ink); font-family:'Inter',sans-serif; -webkit-font-smoothing:antialiased;
    touch-action:manipulation; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;}
  body{min-height:100vh; padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);}
  h1,h2,h3{font-family:'Sora',sans-serif; margin:0;}
  .mono{font-family:'IBM Plex Mono',monospace;}
  input,select,textarea,button{font-family:inherit; font-size:17px; color:var(--ink);}
  input,select,textarea{-webkit-user-select:text; user-select:text; background:#241b13; border:1px solid var(--line); border-radius:10px; padding:12px 14px; width:100%;}
  textarea{resize:vertical; min-height:70px;}
  button{cursor:pointer; border:1px solid var(--line); background:#241b13; border-radius:12px; padding:12px 18px; font-weight:600; min-height:48px;}
  button:active{transform:scale(.96);}
  button.primary{background:var(--accent); color:#2a1c0f; border-color:var(--accent);}
  button.danger{background:var(--bad-soft); border-color:var(--bad); color:#f0c4b6;}
  button.ghost{background:transparent;}
  button:disabled{opacity:.4;}
  #topbar{display:flex; align-items:center; justify-content:space-between; gap:12px; padding:12px 18px; border-bottom:1px solid var(--line); background:rgba(28,21,16,.95);
    position:sticky; top:0; z-index:10;}
  #topbar h1{font-size:18px;}
  #sync{font-size:12.5px; font-family:'IBM Plex Mono',monospace; color:var(--ink-soft); display:flex; gap:8px; align-items:center;}
  .dot{width:10px; height:10px; border-radius:50%; background:#6b5a48; display:inline-block;}
  .dot.ok{background:var(--good);} .dot.bad{background:var(--bad);} .dot.wait{background:var(--accent);}
  main{max-width:1100px; margin:0 auto; padding:18px 18px 60px;}
  .card{background:var(--card); border:1px solid var(--line); border-radius:16px; padding:18px 20px; margin-bottom:16px;}
  .card h3{font-size:15px; margin-bottom:12px; color:var(--accent); letter-spacing:.04em; text-transform:uppercase;}
  .row{display:flex; gap:12px; align-items:center; flex-wrap:wrap;}
  .grow{flex:1; min-width:0;}
  .sub{color:var(--ink-soft); font-size:13.5px;}
  .seg{display:inline-flex; border:1px solid var(--line); border-radius:12px; overflow:hidden;}
  .seg button{border:0; border-radius:0; background:transparent;}
  .seg button.on{background:var(--accent); color:#2a1c0f;}
  .chips{display:flex; flex-wrap:wrap; gap:10px;}
  .chip{padding:12px 20px; border-radius:30px; font-size:17px;}
  .seat-n{width:34px; height:34px; border-radius:50%; background:var(--accent-soft); color:var(--accent); display:flex; align-items:center; justify-content:center; font-family:'IBM Plex Mono',monospace; font-weight:700; flex-shrink:0;}
  .seat-name{font-weight:700; font-size:19px; width:110px; flex-shrink:0;}
  .seat-row select{flex:1; min-width:220px;}
  .thumb{width:96px; height:68px; border-radius:8px; background:#3a2c20 center 30%/cover no-repeat; border:1px solid var(--line); flex-shrink:0; padding:0; min-height:0;}
  .iconbtn{width:46px; padding:0; min-height:46px;}
  /* setup extras */
  .seat-row{display:flex; align-items:center; gap:12px; padding:12px 0; border-top:1px solid var(--line); flex-wrap:wrap;}
  .seat-row:first-of-type{border-top:0;}
  .laygrid{display:flex; flex-wrap:wrap; gap:14px;}
  .lay{padding:10px; width:176px; text-align:center; border-radius:14px;}
  .lay.on{border-color:var(--accent); background:var(--accent-soft);}
  .lay .mini{display:grid; gap:3px; height:96px; margin-bottom:8px;}
  .lay .mini>div{background:#3a2c20; border-radius:5px; display:flex; align-items:center; justify-content:center; gap:4px; font-size:11px; color:var(--ink-soft);}
  .lay .mini i{font-style:normal; font-size:10px; color:var(--accent); display:inline-block;}
  .lay .mini b{color:var(--ink); font-family:'IBM Plex Mono',monospace;}
  .lay .cap{font-size:13px; color:var(--ink-soft);}
  /* play: full-screen table */
  body.playing #topbar{display:none;}
  body.playing main{max-width:none; padding:0;}
  .table{position:fixed; inset:0; display:grid; gap:8px; background:#120d09;
    padding:calc(8px + env(safe-area-inset-top)) calc(8px + env(safe-area-inset-right)) calc(8px + env(safe-area-inset-bottom)) calc(8px + env(safe-area-inset-left));}
  .cell{position:relative; overflow:hidden; min-width:0; min-height:0; border-radius:22px;}
  .seat{position:absolute; border-radius:22px; overflow:hidden; background:#3a2c20 center 30%/cover no-repeat; border:3px solid transparent; --fs:90px;}
  .seat.cur{border-color:var(--accent); box-shadow:inset 0 0 0 3px rgba(201,160,106,.35), 0 0 22px rgba(201,160,106,.35);}
  .seat.out{filter:grayscale(.85) brightness(.55);}
  .seat .shade{position:absolute; inset:0; background:linear-gradient(180deg, rgba(0,0,0,.6) 0%, rgba(0,0,0,.2) 40%, rgba(0,0,0,.72) 100%);}
  .seat .who{position:absolute; top:10px; left:0; right:0; text-align:center; text-shadow:0 2px 8px #000; pointer-events:none; padding:0 8px;}
  .seat .who b{display:block; font-family:'Sora',sans-serif; font-size:calc(var(--fs)*.26); line-height:1.1;}
  .seat .who span{display:block; font-size:calc(var(--fs)*.15); opacity:.9; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .seat .who em{font-style:normal; margin-top:4px;}
  .lbtn{position:absolute; top:0; bottom:0; width:27%; border:0; border-radius:0; padding:0; background:rgba(0,0,0,.16); color:#fff; font-size:calc(var(--fs)*.7); font-weight:300; line-height:1;
    text-shadow:0 2px 10px #000; min-height:0; touch-action:none;}
  .lbtn.minus{left:0;} .lbtn.plus{right:0;}
  .lbtn:active{background:rgba(255,255,255,.2); transform:none;}
  .lbtn:disabled{opacity:.25;}
  .seat .center{position:absolute; left:27%; right:27%; top:0; bottom:0; display:flex; flex-direction:column; align-items:center; justify-content:center; padding-top:calc(var(--fs)*.25);}
  .seat .delta{height:calc(var(--fs)*.4); font-family:'Sora',sans-serif; font-weight:800; font-size:calc(var(--fs)*.36); line-height:1; text-shadow:0 2px 10px #000;}
  .delta.pos{color:#a8d680;} .delta.neg{color:#ff8a6a;}
  .delta.pop{animation:pop .3s ease-out;}
  @keyframes pop{0%{transform:translateY(8px) scale(.8); opacity:.2;} 100%{transform:none; opacity:1;}}
  .life{font-family:'Sora',sans-serif; font-weight:800; font-size:var(--fs); line-height:1; text-shadow:0 4px 22px #000, 0 0 6px #000;}
  .life.low{color:#ffd29a;} .life.dead{color:#ff8a6a;}
  .seat .foot{position:absolute; left:0; right:0; bottom:10px; display:flex; justify-content:center; gap:10px; pointer-events:none;}
  .seat .foot button{pointer-events:auto; min-height:0; padding:calc(var(--fs)*.12) calc(var(--fs)*.3); font-size:calc(var(--fs)*.2); border-radius:30px;}
  .seat .foot button[hidden]{display:none;}
  .seat .who{pointer-events:auto; cursor:pointer;}
  .seat .center{pointer-events:none;}
  .seat .life{pointer-events:auto; cursor:pointer;}
  .seat .bottom{position:absolute; left:0; right:0; bottom:10px; display:flex; flex-direction:column; align-items:center; gap:calc(var(--fs)*.07); pointer-events:none;}
  .seat .foot{position:static; display:flex; justify-content:center; gap:10px; pointer-events:none;}
  /* counter chips: stacked under the commander name, kept inside the centre column so they never reach the +/- buttons (27% each side) */
  .seat .who .cnts{display:flex; flex-direction:column; align-items:center; gap:4px; width:46%; max-width:46%; margin:6px auto 0; pointer-events:auto; cursor:pointer;}
  .seat .who .cnts.two{display:grid; grid-template-columns:repeat(2,max-content); justify-content:center; gap:4px 6px;}
  .seat .cnts[hidden]{display:none;}
  .seat .who .cchip{display:block; overflow:visible; opacity:1; background:rgba(20,14,9,.82); border:1.6px solid var(--c,#cdbfae); border-radius:16px; padding:2px 8px; font-size:max(9px, calc(var(--fs)*.12)); white-space:nowrap; line-height:1.3; text-shadow:none;}
  .seat .who .cchip b{display:inline; font-size:inherit; line-height:inherit; font-family:'Sora',sans-serif; margin-left:3px;}
  .cchip.lethal{background:var(--bad-soft); border-color:var(--bad); color:#ffd1c2;}
  /* player window */
  .pw-sec{margin:16px 0 6px; font-family:'Sora',sans-serif; font-weight:700; font-size:15px; color:var(--accent); letter-spacing:.04em; text-transform:uppercase;}
  .pw-sec .sub{text-transform:none; letter-spacing:0; font-family:'Inter',sans-serif; font-weight:400;}
  .pw-check{display:flex; align-items:center; gap:8px; margin-bottom:8px;}
  .pw-check input{width:22px; height:22px; padding:0;}
  .pw-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:10px;}
  .pw-tile{display:flex; align-items:center; gap:10px; background:#241b13; border:1px solid var(--line); border-radius:14px; padding:10px 12px;}
  .pw-tile .thumb{width:64px; height:46px;}
  .pw-t{font-weight:700; font-size:15px; line-height:1.2;}
  .pw-v{font-family:'Sora',sans-serif; font-weight:800; font-size:26px; min-width:42px; text-align:center;}
  .pw-tile.cnt.has{border-color:var(--c);}
  .pw-tile.lethal{border-color:var(--bad); background:var(--bad-soft);}
  .cdot{display:inline-block; width:10px; height:10px; border-radius:50%; background:var(--c); margin-right:7px;}
  .lethal-tag[hidden]{display:none;}
  .late{color:#ff3030 !important; background:#fff; padding:1px 8px; border-radius:8px; font-weight:800;}
  #buildtag{position:fixed;left:8px;bottom:4px;font:10px monospace;color:#ffffff66;z-index:5;pointer-events:none;}
  #hub{position:fixed; left:calc(14px + env(safe-area-inset-left)); top:calc(14px + env(safe-area-inset-top)); width:64px; height:64px; border-radius:50%; padding:0; z-index:20;
    background:rgba(28,21,16,.9); border:2px solid var(--accent); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:0; line-height:1.05; min-height:0;}
  #hub b{font-family:'Sora',sans-serif; font-size:20px;}
  #hub:active{transform:scale(.94);}
  /* results */
  .res{display:flex; align-items:center; gap:14px; padding:12px 0; border-top:1px solid var(--line); flex-wrap:wrap;}
  .res:first-of-type{border-top:0;}
  .win{border-color:var(--accent) !important; background:var(--accent-soft) !important;}
  .toggle{min-width:110px;}
  .toggle.on{background:var(--accent-soft); border-color:var(--accent); color:var(--accent);}
  /* modal */
  #modal{position:fixed; inset:0; background:rgba(0,0,0,.7); display:none; align-items:center; justify-content:center; z-index:50; padding:20px;}
  #modal.show{display:flex;}
  #modal .box{background:var(--card); border:1px solid var(--line); border-radius:18px; width:min(960px,100%); max-height:90vh; overflow:auto; padding:20px;}
  .artgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:12px; margin-top:14px;}
  .artopt{padding:0; border-radius:12px; overflow:hidden; text-align:left; background:#241b13; min-height:0; display:block;}
  .artopt.sel{outline:3px solid var(--accent);}
  .artopt img{display:block; width:100%; aspect-ratio:1.37; object-fit:cover;}
  .artopt .cap{padding:8px 10px; font-size:12.5px; color:var(--ink-soft);}
  .hit{display:block; width:100%; text-align:left; margin-bottom:8px;}
  .empty{border:1.5px dashed var(--line); border-radius:12px; padding:22px; text-align:center; color:var(--ink-soft);}
  .quote-item{padding:8px 0; border-top:1px solid var(--line); display:flex; gap:10px; align-items:center;}
  .quote-item:first-child{border-top:0;}
</style>
</head>
<body>
<div id="topbar">
  <h1>Friday Night Commander <span class="sub mono" style="font-size:12px;">· tracker</span></h1>
  <div class="row">
    <div id="sync"></div>
    <button id="btn-settings" class="ghost iconbtn" title="Settings">⚙︎</button>
  </div>
</div>
<main id="app"></main>
<div id="modal"><div class="box" id="modal-box"></div></div>

<script>
(function(){
  var KEY='fnc-tracker-v1';
  function wipe(){ try{ var o=JSON.parse(localStorage.getItem(KEY)||'{}'); var keep={cfg:o.cfg||{url:'',token:''},pending:o.pending||[]}; localStorage.setItem(KEY,JSON.stringify(keep)); }catch(e){ try{localStorage.removeItem(KEY);}catch(_){} } }
  if(/[?&]reset=1/.test(location.search)){ wipe(); location.replace(location.pathname); }
  window.__fncWipe=wipe;
  function banner(msg){
    if(document.getElementById('fnc-err'))return;
    var d=document.createElement('div'); d.id='fnc-err';
    d.style.cssText='position:fixed;left:0;right:0;bottom:0;z-index:99999;background:#7a1f1f;color:#fff;padding:14px 18px;font:16px -apple-system,sans-serif;display:flex;gap:14px;align-items:center;justify-content:center;';
    d.innerHTML='<span>Tracker hit an error: '+String(msg).replace(/</g,'&lt;')+'</span><button style="font-size:16px;padding:10px 16px;border-radius:10px;border:0;">Reset saved game &amp; reload</button>';
    d.querySelector('button').onclick=function(){ window.__fncWipe(); location.reload(); };
    document.body.appendChild(d);
  }
  window.addEventListener('error',function(e){ banner(e.message||'unknown'); });
  window.addEventListener('unhandledrejection',function(e){ banner((e.reason&&e.reason.message)||e.reason||'promise error'); });
})();
</script>

function todayStr() { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function fresh() {
  return { screen: 'setup', night: todayStr(), format: 'FFA', podSize: 4, layout: null, startLife: 40, cmdLife: false, players: [], game: null, undo: [], quotes: [],
    pending: [], cfg: { url: '', token: '' }, results: null, lastMsg: '' };
}
let S = (() => { try { const s = JSON.parse(localStorage.getItem(KEY)); return s ? Object.assign(fresh(), s) : fresh(); } catch (e) { return fresh(); } })();
// Upgrade a game saved by an older version of this page: fill in any fields added since, so nothing reads an undefined.
function normalizeState() {
  S.players = (Array.isArray(S.players) ? S.players : []).map(p => {
    const q = Object.assign(newPlayer((p && p.name) || '?'), p || {});
    if (!Number.isFinite(q.life)) q.life = S.startLife || 40;
    if (!Array.isArray(q.lifeLog)) q.lifeLog = [];

    if (!q.cmdDmg || typeof q.cmdDmg !== 'object') q.cmdDmg = {};

function historyFor(player) {
  const merged = {};
  for (const [c, n] of Object.entries(BUILTIN_HISTORY[player] || {})) merged[c] = n;
  for (const [c, n] of Object.entries(HIST[player] || {})) merged[c] = Math.max(merged[c] || 0, n);
  return Object.entries(merged).sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]));
}

// ---------------- game clock (pausable, timestamp based so the iPad sleeping doesn't break it) ----------------
function nowMs() { const g = S.game; if (!g) return 0; return (g.pausedAt != null ? g.pausedAt : Date.now()) - g.startedAt - g.pausedTotal; }
function fmtClock(ms) { const s = Math.max(0, Math.floor(ms / 1000)); const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), ss = s % 60;

// ---------------- Scryfall ----------------
const SF = 'https://api.scryfall.com';
function lookupName(n) { return String(n || '').replace(/\s*\([^)]*\)\s*$/, '').trim(); }
function artOf(card) { return (card.image_uris && card.image_uris.art_crop) || (card.card_faces && card.card_faces[0] && card.card_faces[0].image_uris && card.card_faces[0].image_uris.art_crop) || null; }
async function sfJson(url) { const r = await fetch(url); if (!r.ok) throw new Error('scryfall ' + r.status); return r.json(); }
async function fetchDefaultArt(name) {
  const n = lookupName(name);
  for (const q of [n, n.split(/\s*\/\/\s*|\s+\+\s+/)[0]]) {
    try { const c = await sfJson(`${SF}/cards/named?exact=${encodeURIComponent(q)}`); const url = artOf(c); if (url) return { id: c.id, url }; } catch (e) {}
  }
  return null;
}
async function fetchPrintings(name) {
  const n = lookupName(name);
  for (const q of [n, n.split(/\s*\/\/\s*|\s+\+\s+/)[0]]) {
    try {
      let json = await sfJson(`${SF}/cards/search?q=${encodeURIComponent('!"' + q + '"')}&unique=prints&order=released&dir=desc`);
      let out = json.data || [];
      while (json.has_more && out.length < 400) { json = await sfJson(json.next_page); out = out.concat(json.data || []); }
      out = out.map(c => ({ id: c.id, url: artOf(c), set: c.set_name, code: (c.set || '').toUpperCase(), year: (c.released_at || '').slice(0, 4), artist: c.artist || '' })).filter(c => c.url);
      if (out.length) return out;
    } catch (e) {}
  }
  return [];
}
async function ensureArt(p) {

  if (!p.art && ART[p.commander]) p.art = ART[p.commander];
  if (!p.art) {
    const a = await fetchDefaultArt(p.commander);
    if (a) { p.art = a; ART[p.commander] = a; saveArt(); }

}

function newPlayer(name) { return { name, commander: '', art: null, elimRound: null, turnMs: [], ohsr: false, note: '', life: 40, lifeLog: [], delta: null, cmdDmg: {}, counters: {} }; }

// ---------------- play ----------------
function startGame() {
  const missing = S.players.filter(p => !p.commander).map(p => p.name);
  if (missing.length && !confirm('No commander chosen for ' + missing.join(', ') + '. Start anyway? (They will be saved as unknown.)')) return;
  S.players.forEach(p => { p.elimRound = null; p.turnMs = []; p.ohsr = false; p.note = ''; p.life = S.startLife; p.lifeLog = []; p.delta = null; p.cmdDmg = {}; p.counters = {}; });
  S.game = { startedAt: Date.now(), pausedAt: null, pausedTotal: 0, cur: 0, round: 1, turnStart: 0, ended: false };
  S.undo = []; S.results = null; S.screen = 'play'; save(); render();
}
function alive() { return S.players.map((p, i) => p.elimRound == null ? i : -1).filter(i => i >= 0); }
function snapshot() { S.undo.push(JSON.stringify({ g: S.game, p: S.players.map(p => ({ e: p.elimRound, t: p.turnMs })) })); if (S.undo.length > 30) S.undo.shift(); }
function advance(fromIdx) {
  const al = alive(); if (al.length <= 1) return false;
  let n = fromIdx, wrapped = false;
  for (let k = 0; k < S.players.length; k++) { n = (n + 1) % S.players.length; if (n <= fromIdx) wrapped = true; if (S.players[n].elimRound == null) break; }
  if (wrapped) S.game.round++;
  S.game.cur = n; S.game.turnStart = nowMs();
  return true;
}
function passTurn() {
  const g = S.game; if (!g || g.pausedAt != null) return;
  snapshot();
  const cur = S.players[g.cur];
  cur.turnMs.push(nowMs() - g.turnStart);
  if (!advance(g.cur)) { toResults(); return; }
  save(); render();
}
function eliminate(i) {
  const g = S.game; const p = S.players[i];
  if (p.elimRound != null || !confirm(`Eliminate ${p.name}?`)) return;
  closeModal();
  snapshot();
  p.elimRound = g.round;
  if (i === g.cur) { p.turnMs.push(nowMs() - g.turnStart); advance(i); }
  const al = alive();
  save();
  if (al.length <= 1) { toResults(al[0]); return; }
  render();
}
function undo() {
  if (!S.undo.length) return;
  const s = JSON.parse(S.undo.pop()); Object.assign(S.game, { cur: s.g.cur, round: s.g.round, turnStart: s.g.turnStart });
  s.p.forEach((x, i) => { S.players[i].elimRound = x.e; S.players[i].turnMs = x.t; });
  save(); render();
}
function togglePause() {
  const g = S.game; if (!g) return;
  if (g.pausedAt == null) g.pausedAt = Date.now(); else { g.pausedTotal += Date.now() - g.pausedAt; g.pausedAt = null; }
  save(); render();
}

// ----- life totals -----
// Taps made within BURST_MS of each other count as one change (three taps of "−" = "−3"). The floating number
// stays on the panel until that player's life changes again, then it starts over with the new change.
const BURST_MS = 2500;
function fmtDelta(v) { return (v > 0 ? '+' : '−') + Math.abs(v); }
function changeLife(i, d) {
  const g = S.game, p = S.players[i];
  if (!g || !p || p.elimRound != null || !d) return;
  const now = Date.now();
  p.life += d;
  if (p.delta && now - p.delta.ts < BURST_MS && p.lifeLog.length) {
    p.delta.value += d; p.delta.ts = now;
    const e = p.lifeLog[p.lifeLog.length - 1]; e.delta = p.delta.value; e.total = p.life;
  } else {
    p.delta = { value: d, ts: now };
    p.lifeLog.push({ ms: nowMs(), round: g.round, by: S.players[g.cur].name, delta: d, total: p.life });
  }
  save(); updateSeat(i, true);
}
function setLife(i, total) { const p = S.players[i]; changeLife(i, total - p.life); }

// ---- sound that works on iPad: a real <audio> chime (ignores the silent switch) + speech, unlocked by touches ----

    <div class="row" style="margin-bottom:12px;">
      <div class="seg" id="mode"><button data-m="win" class="${R.mode === 'win' ? 'on' : ''}">${two ? 'Winning team' : 'Winner'}</button><button data-m="draw" class="${R.mode === 'draw' ? 'on' : ''}">Draw</button><button data-m="none" class="${R.mode === 'none' ? 'on' : ''}">Not recorded</button></div>
      <div class="sub">${fmtClock(g.endedAt)} · ${g.round} turn${g.round === 1 ? '' : 's'}${two ? ' · pick both teammates' : ''}</div>
    </div>
    ${S.players.map((p, i) => `
      <div class="res ${R.mode === 'win' && R.winners.includes(i) ? 'win' : ''}" style="border-radius:12px; padding:12px;">
        <div class="thumb" style="${p.art ? `background-image:url('${esc(p.art.url)}')` : ''}"></div>
        <div style="min-width:150px;"><div style="font-weight:700; font-size:18px;">${esc(p.name)}</div><div class="sub">${esc(p.commander || 'Unknown')}${p.elimRound != null ? ` · out T${p.elimRound}` : ''}</div><div class="sub mono">${lifeSummary(p)}</div></div>
        ${R.mode === 'win' ? `<button data-win="${i}" class="${R.winners.includes(i) ? 'primary' : ''}">${R.winners.includes(i) ? '🏆 Winner' : 'Winner?'}</button>` : ''}
        <button class="toggle ${p.ohsr ? 'on' : ''}" data-ohsr="${i}">${p.ohsr ? '✓ ' : ''}Sol Ring in opener</button>
        <input class="grow" style="min-width:200px;" data-note="${i}" type="text" placeholder="Note (optional)" value="${esc(p.note)}">
      </div>`).join('')}
  </div>
  <div class="row" style="justify-content:space-between;">
    <button id="back">← Back to game</button>
    <button class="primary" id="submit" style="min-width:260px; font-size:20px;" ${ready ? '' : 'disabled'}>Save to sheet ✓</button>
  </div>`;
}
function bindResults() {
  const R = S.results;
  document.querySelectorAll('#mode button').forEach(b => b.onclick = () => { R.mode = b.dataset.m; if (R.mode !== 'win') R.winners = []; save(); render(); });
  document.querySelectorAll('[data-win]').forEach(b => b.onclick = () => {
    const i = +b.dataset.win, need = S.format === '2HG' ? 2 : 1;
    if (R.winners.includes(i)) R.winners = R.winners.filter(x => x !== i); else { R.winners.push(i); if (R.winners.length > need) R.winners.shift(); }
    save(); render();
  });
  document.querySelectorAll('[data-ohsr]').forEach(b => b.onclick = () => { const p = S.players[+b.dataset.ohsr]; p.ohsr = !p.ohsr; save(); render(); });
  document.querySelectorAll('[data-note]').forEach(inp => inp.oninput = () => { S.players[+inp.dataset.note].note = inp.value; save(); });
  $('#back').onclick = () => { S.game.endedAt = null; S.screen = 'play'; save(); render(); };
  $('#submit').onclick = submitGame;
}

function buildPayload() {
  const g = S.game, R = S.results, two = S.format === '2HG';
  const finalRound = g.round;
  return {
    id: 'g' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
    date: S.night, format: S.format,
    totalTurns: finalRound,
    lengthMin: Math.round(g.endedAt / 60000),
    quotes: S.quotes.slice(),
    players: S.players.map((p, i) => {
      const done = p.turnMs.length;
      return {
        name: p.name, commander: p.commander || '~Unknown',
        result: R.mode === 'draw' ? 'DRAW' : (R.mode === 'win' && R.winners.includes(i) ? 'yes' : ''),
        ohsr: !!p.ohsr, twoHG: two, note: (p.note || '').trim(),
        turnOrder: i + 1,
        // matches the existing sheet: players still alive at the end get the final turn number
        elimTurn: p.elimRound != null ? p.elimRound : finalRound,
        artId: p.art ? p.art.id : '',
        avgTurnSec: done ? Math.round(p.turnMs.reduce((a, b) => a + b, 0) / done / 1000) : '',
      };
    }),
  };
}
function submitGame() {
  const payload = buildPayload();
  // remember the commanders for next time
  for (const p of payload.players) if (p.commander !== '~Unknown') { HIST[p.name] = HIST[p.name] || {}; HIST[p.name][p.commander] = (HIST[p.name][p.commander] || (BUILTIN_HISTORY[p.name] || {})[p.commander] || 0) + 1; }
  try { localStorage.setItem(HIST_KEY, JSON.stringify(HIST)); } catch (e) {}
  S.pending.push({ payload });
  S.sessionGames = (S.sessionNight === S.night ? S.sessionGames || 0 : 0) + 1; S.sessionNight = S.night;
  S.quotes = []; S.game = null; S.undo = []; S.results = null; S.screen = 'done'; save(); render();
  trySync();
}
function renderDone() {
  const n = S.pending.length;
  return `<div class="card" style="text-align:center; padding:40px 20px;">
    <h2 style="font-size:30px;">Game saved</h2>
    <p class="sub" style="font-size:16px;">${n ? `${n} game${n === 1 ? '' : 's'} waiting to sync — it will send automatically when the sheet is reachable.` : 'It is in the sheet.'}</p>
    <div class="row" style="justify-content:center; margin-top:20px;">
      <button class="primary" id="again" style="font-size:20px;">Next game — same players</button>
      <button id="newpods">New table</button>
    </div></div>`;
}
function bindDone() {
  $('#again').onclick = () => { S.players.forEach(p => { p.elimRound = null; p.turnMs = []; p.ohsr = false; p.note = ''; }); S.screen = 'setup'; save(); render(); };
  $('#newpods').onclick = () => { S.players = []; S.screen = 'setup'; save(); render(); };
}

// ---------------- sync ----------------
let syncing = false, syncState = { cls: '', text: '' };
function renderSync() {
  const n = S.pending.length;
  let cls = 'dot', text = '';
  if (!S.cfg.url) { cls += ' bad'; text = 'sheet not connected'; }
  else if (syncing) { cls += ' wait'; text = 'sending…'; }
  else if (n) { cls += ' wait'; text = n + ' waiting' + (syncState.text ? ' · ' + syncState.text : ''); }
  else { cls += ' ok'; text = 'synced'; }
  $('#sync').innerHTML = `<span class="${cls}"></span>${esc(text)}`;
}
async function trySync() {
  if (syncing || !S.cfg.url || !S.pending.length) { renderSync(); return; }
  syncing = true; syncState.text = ''; renderSync();
  try {
    while (S.pending.length) {
      const body = JSON.stringify(Object.assign({}, S.pending[0].payload, { token: S.cfg.token }));
      const r = await fetch(S.cfg.url, { method: 'POST', body });   // no custom headers => no CORS preflight
      const j = await r.json();
      if (!j.ok) throw new Error(j.error || 'rejected');
      S.pending.shift(); save();
      if (S.screen === 'done') render();
    }
  } catch (e) { syncState.text = String(e.message || e).slice(0, 60); }
  syncing = false; renderSync();
}
async function refreshHistory() {
  if (!S.cfg.url) return;
  try {
    const r = await fetch(S.cfg.url + (S.cfg.url.includes('?') ? '&' : '?') + 'action=history&token=' + encodeURIComponent(S.cfg.token));
    const j = await r.json();
    if (j.ok && j.history) { HIST = j.history; try { localStorage.setItem(HIST_KEY, JSON.stringify(HIST)); } catch (e) {} /* no redraw: it would yank open dropdowns; applies on the next render */ }
  } catch (e) {}
}
window.addEventListener('online', trySync);
setInterval(trySync, 30000);

// ---------------- settings ----------------
$('#btn-settings').onclick = () => {
  openModal(`<div class="row" style="justify-content:space-between;"><h2 style="font-size:22px;">Sheet connection</h2><button id="m-close">Close</button></div>
    <div class="sub" style="margin:8px 0 14px;">Paste the Web app URL from your Google Apps Script deployment, and the same secret token you put in the script.</div>
    <div class="sub">Web app URL</div><input id="s-url" type="text" value="${esc(S.cfg.url)}" placeholder="https://script.google.com/macros/s/…/exec">
    <div class="sub" style="margin-top:12px;">Secret token</div><input id="s-tok" type="text" value="${esc(S.cfg.token)}" placeholder="the token from the script">
    <label class="row" style="margin-top:14px; gap:10px;"><input type="checkbox" id="s-sound" ${S.cfg.sound !== false ? 'checked' : ''} style="width:22px;height:22px;"> <span>Spoken reminder when a turn passes 5 minutes (and every 5 after)</span></label>
    <div class="row" style="margin-top:8px;"><button id="s-test">Test the alert (chime + voice)</button></div>
    <div class="row" style="margin-top:16px;"><button class="primary" id="s-save">Save &amp; test</button><div id="s-msg" class="sub"></div></div>
    <hr style="border:0; border-top:1px solid var(--line); margin:20px 0;">
    <div class="sub" style="margin-bottom:10px;">Tracker build ${BUILD}</div>
    <div class="row"><button class="danger" id="s-reset">Discard unsent games &amp; reset app state</button></div>`);
  $('#m-close').onclick = closeModal;
  $('#s-sound').onchange = () => { S.cfg.sound = $('#s-sound').checked; save(); };
  $('#s-test').onclick = () => { unlockAudio(); fireAlert('Randy', 1); };
  $('#s-save').onclick = async () => {
    S.cfg.url = $('#s-url').value.trim(); S.cfg.token = $('#s-tok').value.trim(); save();
    const msg = $('#s-msg'); msg.textContent = 'Testing…';
    try {
      const r = await fetch(S.cfg.url + (S.cfg.url.includes('?') ? '&' : '?') + 'action=ping&token=' + encodeURIComponent(S.cfg.token));
      const j = await r.json(); msg.textContent = j.ok ? '✓ Connected' : ('✗ ' + (j.error || 'rejected'));
      if (j.ok) { refreshHistory(); trySync(); }
    } catch (e) { msg.textContent = '✗ Could not reach the script'; }
    renderSync();
  };
  $('#s-reset').onclick = () => { if (confirm(S.pending.length + ' unsent game(s) will be lost. Reset?')) { const cfg = S.cfg; S = fresh(); S.cfg = cfg; save(); closeModal(); render(); } };
};

// ---------------- router ----------------
const BUILD = '2026-11-24 · v12';
function render() {
  try {
    const app = $('#app');
    const sc = S.screen;
    document.body.classList.toggle('playing', sc === 'play' && !!S.game);
    app.innerHTML = sc === 'play' && S.game ? renderPlay() : sc === 'results' && S.game ? renderResults() : sc === 'done' ? renderDone() : renderSetup();
    if (sc === 'play' && S.game) bindPlay(); else if (sc === 'results' && S.game) bindResults(); else if (sc === 'done') bindDone(); else bindSetup();
    renderSync();
    let bt=document.getElementById('buildtag'); if(!bt){bt=document.createElement('div'); bt.id='buildtag'; document.body.appendChild(bt);} bt.textContent='build '+BUILD;
  } catch (e) {
    // never leave a dead screen: offer a way out, and keep any games that have not reached the sheet yet
    document.body.classList.remove('playing');
    $('#app').innerHTML = `<div class="card"><h2 style="font-size:22px;">Something went wrong loading the saved game</h2>
      <p class="sub">${esc(String(e && e.message || e))} · build ${BUILD}</p>
      <div class="row"><button class="primary" id="fix-reset">Reset the tracker (keeps the sheet connection and any unsent games)</button></div></div>`;
    $('#fix-reset').onclick = () => { const keep = { cfg: S.cfg, pending: S.pending }; S = Object.assign(fresh(), keep); S.screen = 'setup'; save(); render(); };
  }
}
render();
S.players.forEach(p => { if (p.commander && !p.art) ensureArt(p); });
refreshHistory(); trySync();
if (!S.cfg.url) setTimeout(() => $('#btn-settings').click(), 400);
</script>
</body>
</html>
